<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NV 클럽 공간</title>
<meta name="description" content="NV 클럽 멤버 전용 공간 — 공지사항, 건의사항, 자유게시판">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://cdn.discordapp.com data:; connect-src https://*.workers.dev http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Michroma&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --ink: #d8d8d6;
    --ink-hi: #f3f3f1;
    --ink-mid: #c4c4c1;
    --ink-dim: #9a9a96;
    --red-top: #a0071e;
    --red-mid: #c92d3f;
    --red-bot: #e64a58;
    --red-soft: #ffb3ba;
    --sky: #44a0c0;
    --line: rgba(230, 74, 88, 0.34);
    --line-soft: rgba(230, 74, 88, 0.16);
    --glass: rgba(14, 8, 10, 0.78);
    --glass-edge: rgba(216, 216, 214, 0.1);
    --rule: rgba(216, 216, 214, 0.1);
    --f-lat: 'Michroma', 'Eurostile', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --f-kr: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    --gut-l: max(16px, env(safe-area-inset-left, 0px));
    --gut-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 760px) {
    :root {
      --gut-l: max(32px, env(safe-area-inset-left, 0px));
      --gut-r: max(32px, env(safe-area-inset-right, 0px));
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse 70% 320px at 50% -60px, rgba(160, 7, 30, 0.32), rgba(160, 7, 30, 0) 75%),
      radial-gradient(ellipse 40% 260px at 92% 8%, rgba(68, 160, 192, 0.06), rgba(0, 0, 0, 0) 70%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--f-kr); font-size: 16px; line-height: 1.7;
    word-break: keep-all; overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  a { color: inherit; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 2px; }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .skip {
    position: absolute; left: var(--gut-l); top: -60px; z-index: 50;
    padding: 10px 14px; background: #000; color: var(--ink-hi); border: 1px solid var(--sky);
  }
  .skip:focus { top: 8px; }
  .wrap {
    width: 100%; max-width: 920px; margin: 0 auto;
    padding-inline: var(--gut-l) var(--gut-r);
  }

  /* ---------- 상단 ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(0, 0, 0, 0.72);
    border-bottom: 1px solid var(--line-soft);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    backdrop-filter: blur(14px) saturate(130%);
  }
  .top-in { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; flex: none;
    min-height: 44px; text-decoration: none; color: var(--ink-hi);
    font-family: var(--f-lat); font-size: 15px; letter-spacing: 0.14em;
  }
  .brand img { width: 30px; height: 30px; display: block; filter: drop-shadow(0 0 10px rgba(230, 74, 88, 0.45)); }
  .brand-sub { font-size: 10px; letter-spacing: 0.3em; color: var(--red-bot); padding-left: 2px; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who-av { width: 28px; height: 28px; border-radius: 50%; flex: none; background: #1a1012; }
  .who-name {
    min-width: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 14.5px; font-weight: 600; color: var(--ink-hi);
  }

  /* ---------- 공통 ---------- */
  main { flex: 1 0 auto; padding-block: 24px 72px; }
  main:focus { outline: none; }
  .idx {
    display: inline-flex; align-items: center; gap: 12px; margin: 0 0 8px;
    font-family: var(--f-lat); font-size: 10.5px; letter-spacing: 0.3em; color: var(--red-bot);
  }
  .idx::after { content: ''; width: 36px; height: 1px; background: linear-gradient(90deg, var(--red-bot), rgba(230, 74, 88, 0)); }
  .h1 { margin: 0; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; color: var(--ink-hi); }
  .h1:focus { outline: none; }
  .h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; color: var(--ink-hi); }
  .desc { margin: 6px 0 0; font-size: 14.5px; line-height: 1.65; color: var(--ink-dim); max-width: 40em; }
  .muted { color: var(--ink-dim); }
  .panel {
    position: relative; background: var(--glass); border: 1px solid var(--glass-edge);
    padding: clamp(18px, 3vw, 28px);
  }
  .hud::before, .hud::after { content: ''; position: absolute; width: 14px; height: 14px; pointer-events: none; }
  .hud::before { top: -1px; left: -1px; border-top: 1px solid var(--red-bot); border-left: 1px solid var(--red-bot); }
  .hud::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--red-bot); border-right: 1px solid var(--red-bot); }

  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: 2px; border: 0; cursor: pointer;
    font-size: 15px; font-weight: 600; line-height: 1.2; text-decoration: none; color: #fff;
    white-space: nowrap; transition: box-shadow 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(170deg, #b8142c 0%, #a0071e 45%, #c92d3f 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 140, 150, 0.32), 0 10px 30px -14px rgba(230, 74, 88, 0.9);
  }
  .btn-primary:hover { box-shadow: inset 0 0 0 1px rgba(255, 160, 170, 0.6), 0 0 26px rgba(230, 74, 88, 0.45); }
  .btn-ghost { color: var(--ink-hi); background: rgba(0, 0, 0, 0.35); box-shadow: inset 0 0 0 1px rgba(216, 216, 214, 0.3); }
  .btn-ghost:hover { box-shadow: inset 0 0 0 1px rgba(230, 74, 88, 0.75); }
  .btn-sky { color: var(--ink-hi); background: rgba(68, 160, 192, 0.1); box-shadow: inset 0 0 0 1px rgba(68, 160, 192, 0.55); }
  .btn-sky:hover { background: rgba(68, 160, 192, 0.18); }
  .btn-danger { color: var(--red-soft); background: transparent; box-shadow: inset 0 0 0 1px rgba(230, 74, 88, 0.45); }
  .btn-danger:hover { background: rgba(160, 7, 30, 0.2); }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .btn-text {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px;
    background: none; border: 0; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-mid);
    text-decoration: none; border-radius: 2px;
  }
  .btn-text:hover { color: var(--ink-hi); text-decoration: underline; text-underline-offset: 4px; }
  .btn-text.danger { color: var(--red-soft); }
  .btn-wide { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .badge {
    display: inline-flex; align-items: center; height: 22px; padding: 0 7px; flex: none;
    font-size: 12px; font-weight: 600; line-height: 1; border-radius: 2px; white-space: nowrap;
    border: 1px solid rgba(216, 216, 214, 0.25); color: var(--ink-mid);
  }
  .b-pin { color: var(--red-soft); border-color: rgba(230, 74, 88, 0.5); background: rgba(160, 7, 30, 0.2); }
  .b-todo { color: #8fd3ea; border-color: rgba(68, 160, 192, 0.6); background: rgba(68, 160, 192, 0.1); }
  .b-hidden { color: var(--ink-dim); border-style: dashed; }
  .b-staff { height: 20px; padding: 0 6px; font-size: 11.5px; color: var(--red-soft); border-color: rgba(230, 74, 88, 0.4); }
  .b-left { height: 20px; padding: 0 6px; font-size: 11.5px; color: var(--ink-dim); }

  .alert { margin: 0 0 16px; padding: 12px 14px; border: 1px solid rgba(230, 74, 88, 0.5); background: rgba(160, 7, 30, 0.14); color: var(--ink-hi); font-size: 15px; }
  .info { margin: 0 0 16px; padding: 12px 14px; border: 1px solid rgba(68, 160, 192, 0.4); background: rgba(68, 160, 192, 0.07); color: var(--ink); font-size: 14.5px; }

  .loading { display: flex; align-items: center; gap: 12px; padding: 40px 0; color: var(--ink-dim); font-size: 15px; }
  .loading::before {
    content: ''; width: 18px; height: 18px; border-radius: 50%; flex: none;
    border: 2px solid rgba(230, 74, 88, 0.25); border-top-color: var(--red-bot);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .loading::before { animation: none; } * { transition: none !important; } }

  /* ---------- 탭 ---------- */
  .tabs {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    margin: 0 0 26px; border-bottom: 1px solid var(--rule);
  }
  .tabs a {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 50px; padding: 0 6px; text-decoration: none; text-align: center;
    font-size: 15.5px; font-weight: 600; color: var(--ink-dim);
  }
  .tabs a:hover { color: var(--ink-hi); }
  .tabs a[aria-current="page"] { color: var(--ink-hi); }
  .tabs a[aria-current="page"]::after {
    content: ''; position: absolute; left: 12%; right: 12%; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, var(--red-top), var(--red-bot));
  }

  /* ---------- 목록 ---------- */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin: 0 0 20px; }
  .head > div { min-width: 0; flex: 1 1 320px; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 18px;
    min-height: 68px; padding: 12px 6px; border-bottom: 1px solid var(--rule);
    text-decoration: none; color: inherit; transition: background-color 0.2s ease;
  }
  .row:hover { background: rgba(230, 74, 88, 0.05); }
  .row-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-width: 0; }
  .row-title { font-size: 16.5px; font-weight: 600; color: var(--ink-hi); line-height: 1.45; overflow-wrap: anywhere; min-width: 0; }
  .row-meta { grid-column: 1; font-size: 13px; color: var(--ink-dim); }
  .row-rc {
    grid-column: 2; grid-row: 1 / span 2; justify-self: end; text-align: right;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-mid); font-variant-numeric: tabular-nums;
  }
  .row-rc b { color: var(--ink-hi); font-weight: 600; }
  .empty { padding: 36px 6px; border-bottom: 1px solid var(--rule); color: var(--ink-dim); font-size: 15px; }
  .more { display: flex; justify-content: center; margin-top: 18px; }
  .sub-h { margin: 34px 0 10px; font-size: 16px; font-weight: 700; color: var(--ink-hi); }
  @media (max-width: 560px) {
    .row { grid-template-columns: minmax(0, 1fr); }
    .row-rc { grid-column: 1; grid-row: auto; justify-self: start; text-align: left; }
  }

  /* ---------- 글 ---------- */
  .back {
    display: flex; width: fit-content; align-items: center; gap: 6px; min-height: 44px; margin: 0 0 6px -4px; padding: 0 4px;
    font-size: 14.5px; color: var(--ink-mid); text-decoration: none;
  }
  .back:hover { color: var(--ink-hi); }
  .back svg { width: 16px; height: 16px; }
  .post-badges { display: flex; gap: 6px; margin: 0 0 10px; }
  .post-title { overflow-wrap: anywhere; }
  .post-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 10px 0 0; font-size: 14px; color: var(--ink-dim); }
  .post-meta .name { color: var(--ink-mid); font-weight: 600; }
  .post-body {
    margin: 22px 0 0; padding: 22px 0 0; border-top: 1px solid var(--rule);
    font-size: 16.5px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .post-body a, .c-body a { color: #8fd3ea; text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
  .ack {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px;
    margin: 26px 0 0; padding: 16px 18px; border: 1px solid rgba(68, 160, 192, 0.4); background: rgba(68, 160, 192, 0.07);
  }
  .ack p { margin: 0; font-size: 15px; color: var(--ink); }
  .ack.done { justify-content: flex-start; color: #8fd3ea; font-weight: 600; font-size: 15px; }
  .ack.done svg { width: 20px; height: 20px; flex: none; }
  .staff-tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 16px 0 0; padding: 14px 0 0;
    border-top: 1px dashed rgba(230, 74, 88, 0.25);
  }
  .staff-tools .lbl { font-family: var(--f-lat); font-size: 10px; letter-spacing: 0.26em; color: var(--red-bot); margin-right: 4px; }
  .manage { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0 4px; margin: 14px -10px 0 0; }

  /* ---------- 댓글 ---------- */
  .comments { margin-top: 34px; }
  .c-list { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--rule); }
  .c-item { padding: 14px 0 10px; border-bottom: 1px solid var(--rule); }
  .c-item.staff-reply { border-left: 2px solid rgba(230, 74, 88, 0.55); padding-left: 14px; background: linear-gradient(90deg, rgba(160, 7, 30, 0.1), rgba(160, 7, 30, 0) 60%); }
  .c-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
  .c-head .name { font-weight: 600; color: var(--ink-hi); }
  .c-head time { color: var(--ink-dim); font-size: 13px; }
  .c-body { margin: 4px 0 0; font-size: 15.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .c-tools { display: flex; justify-content: flex-end; gap: 0 2px; margin: 0 -10px 0 0; }
  .c-tools .btn-text { min-height: 40px; font-size: 13.5px; }

  /* ---------- 입력 ---------- */
  .form { display: grid; gap: 18px; }
  .field { display: grid; gap: 6px; }
  .field label, .field .lab { font-size: 14px; font-weight: 600; color: var(--ink-mid); }
  .input, .textarea {
    width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 2px;
    font-size: 16px; line-height: 1.6; color: var(--ink-hi);
    background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(216, 216, 214, 0.2);
  }
  .textarea { min-height: 220px; resize: vertical; }
  .textarea.short { min-height: 96px; }
  .input:focus-visible, .textarea:focus-visible { border-color: var(--sky); outline: 2px solid var(--sky); outline-offset: 0; }
  .input::placeholder, .textarea::placeholder { color: #7d7d79; }
  .count { justify-self: end; font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--red-soft); }
  .hint { margin: 0; font-size: 13.5px; color: var(--ink-dim); }
  .check { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 15px; }
  .check input { width: 20px; height: 20px; accent-color: var(--red-mid); }
  .form-err:empty { display: none; }
  .c-form { display: grid; gap: 8px; }
  .c-form .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* ---------- 읽음 현황 ---------- */
  .rc-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 18px; }
  .rc-tab {
    display: grid; gap: 4px; align-content: center; min-height: 76px; padding: 12px 16px; text-align: left; cursor: pointer;
    background: rgba(255, 255, 255, 0.025); border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-mid);
  }
  .rc-tab .t { font-size: 14.5px; font-weight: 600; }
  .rc-tab .n { font-family: var(--f-lat); font-size: 20px; letter-spacing: 0.04em; color: var(--ink-hi); font-variant-numeric: tabular-nums; }
  .rc-tab .n small { font-size: 13px; color: var(--ink-dim); letter-spacing: 0; }
  .rc-tab[aria-selected="true"] { border-color: rgba(230, 74, 88, 0.65); background: rgba(160, 7, 30, 0.16); color: var(--ink-hi); }
  .meter { height: 3px; margin-top: 6px; background: rgba(216, 216, 214, 0.12); overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--red-top), var(--red-bot)); }
  .rc-tab.sky .meter i { background: linear-gradient(90deg, #2c7c98, var(--sky)); }
  .people { list-style: none; margin: 0 0 6px; padding: 0; border-top: 1px solid var(--rule); }
  .people li { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 6px 4px; border-bottom: 1px solid var(--rule); }
  .people .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; color: var(--ink-hi); }
  .people .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .people time { flex: none; font-size: 13.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .people.todo .nm { color: var(--ink); }
  .people .none { justify-content: flex-start; color: var(--ink-dim); font-size: 14.5px; }
  .rc-sub { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 8px; font-size: 15px; font-weight: 700; color: var(--ink-hi); }
  .rc-sub:first-child { margin-top: 0; }
  .rc-sub small { font-size: 13px; font-weight: 500; color: var(--ink-dim); }

  /* ---------- 로그인 ---------- */
  .login { max-width: 480px; margin: clamp(8px, 6vh, 64px) auto 0; text-align: center; }
  .login .mark { width: 88px; height: 88px; display: block; margin: 4px auto 14px; filter: drop-shadow(0 0 22px rgba(230, 74, 88, 0.45)) drop-shadow(0 0 60px rgba(160, 7, 30, 0.45)); }
  .login .idx { justify-content: center; }
  .login .idx::before { content: ''; width: 36px; height: 1px; background: linear-gradient(270deg, var(--red-bot), rgba(230, 74, 88, 0)); }
  .login .desc { margin: 10px auto 22px; }
  .login .alert { text-align: left; }
  .login .small { margin: 16px 0 0; font-size: 13.5px; color: var(--ink-dim); line-height: 1.7; }
  .login .small a { color: var(--ink-mid); text-underline-offset: 3px; display: inline-flex; align-items: center; min-height: 44px; }

  /* ---------- 개인정보 ---------- */
  .doc { max-width: 680px; }
  .doc h2 { margin: 30px 0 8px; font-size: 18px; font-weight: 700; color: var(--ink-hi); }
  .doc p, .doc li { font-size: 15.5px; line-height: 1.8; color: var(--ink); }
  .doc ul { margin: 0; padding-left: 1.2em; }
  .doc li { margin: 2px 0; }
  .doc strong { color: var(--ink-hi); font-weight: 600; }

  /* ---------- 바닥 ---------- */
  .foot { border-top: 1px solid var(--line-soft); padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .foot-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 18px; }
  .foot-main { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink-dim); }
  .foot-main img { width: 20px; height: 20px; display: block; }
  .foot-links { display: flex; gap: 4px; margin-right: -10px; }
  .foot-links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; font-size: 13.5px; color: var(--ink-mid); text-decoration: none; }
  .foot-links a:hover { color: var(--ink-hi); text-decoration: underline; text-underline-offset: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    width: max-content; max-width: calc(100% - 32px); padding: 12px 16px;
    background: #140c0e; border: 1px solid var(--line); color: var(--ink-hi); font-size: 14.5px;
    box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.9); transition: opacity 0.25s ease, transform 0.25s ease;
  }

<script>
'use strict';
const API = 'https://nv-api.e2jinsoopark.workers.dev';

/* 로컬에서만 ?api=http://localhost:8787 처럼 API 주소를 바꿀 수 있다 */
const API_BASE = (function () {
  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname === '[::1]';
  if (local) {
    const q = new URLSearchParams(location.search).get('api');
    if (q && /^https?:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?$/.test(q)) return q;
  }
  return API;
})();

const TOKEN_KEY = 'nv_club_session';
const LOGIN_ERR = {
  denied: '디스코드 로그인을 취소했어요. 다시 해 주세요.',
  not_member: 'NV 디스코드 서버의 클럽 멤버만 들어올 수 있어요. 서버에 들어와 있는지, 클럽 역할이 있는지 운영진에게 물어봐 주세요.',
  state: '로그인 시간이 지났어요. 다시 해 주세요.',
  ticket: '로그인 확인 시간이 지났어요. 다시 해 주세요.',
  discord: '디스코드와 연결하지 못했어요. 잠시 뒤 다시 해 주세요.',
  server: '서버에 문제가 생겼어요. 잠시 뒤 다시 해 주세요.',
  session: '로그인이 끝났어요. 다시 로그인해 주세요.',
};
const ERR = {
  network: '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.',
  server: '서버에 문제가 생겼어요. 잠시 뒤 다시 해 주세요.',
  forbidden: '이 작업은 할 수 없어요.',
  not_found: '글을 찾을 수 없어요. 지워졌거나 볼 수 없는 글이에요.',
  rate: '짧은 시간에 너무 많이 썼어요. 10분쯤 뒤에 다시 써 주세요.',
  title_required: '제목을 써 주세요.',
  title_too_long: '제목은 80자까지 쓸 수 있어요.',
  body_required: '내용을 써 주세요.',
  body_too_long: '내용은 5,000자까지 쓸 수 있어요.',
  comment_required: '댓글 내용을 써 주세요.',
  comment_too_long: '댓글은 1,000자까지 쓸 수 있어요.',
  too_large: '글이 너무 길어요.',
};
const errText = (e) => ERR[e && e.code] || ERR.server;

const state = { token: null, me: null, boards: [], loginError: null, seq: 0 };
const $ = (id) => document.getElementById(id);
const view = $('view');

/* ---------- 저장소(사생활 모드에서는 실패할 수 있음) ---------- */
function loadToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
function saveToken(t) { state.token = t; try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
function clearToken() { state.token = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

/* ---------- DOM 도우미: 사용자 글은 언제나 textContent로만 ---------- */
function h(tag, props) {
  const el = document.createElement(tag);
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach((k) => append(el, k)); return; }
  el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
}
const NS = 'http://www.w3.org/2000/svg';
function icon(kind) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', kind === 'check' ? 'M4 12.5l5 5L20 6.5' : 'M15 5l-7 7 7 7');
  s.append(p);
  return s;
}

/* 줄바꿈은 CSS(pre-wrap), 링크는 http(s)만 a 요소로 */
const URL_RE = /https?:\/\/[A-Za-z0-9\-._~:/?#[\]@!$&()*+,;=%]+/g;
function linkify(text) {
  const out = [];
  let last = 0;
  for (const m of text.matchAll(URL_RE)) {
    let url = m[0];
    let trail = '';
    while (/[.,!?;:)\]]$/.test(url)) {
      const ch = url.slice(-1);
      if (ch === ')' && (url.split('(').length - 1) >= (url.split(')').length - 1)) break;
      trail = ch + trail;
      url = url.slice(0, -1);
    }
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    let ok = false;
    try { const u = new URL(url); ok = u.protocol === 'https:' || u.protocol === 'http:'; } catch (e) {}
    out.push(ok ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer nofollow ugc' }, url) : document.createTextNode(url));
    if (trail) out.push(document.createTextNode(trail));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}

/* ---------- 시간(KST) ---------- */
const KST = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function kst(ms) { const o = {}; for (const p of KST.formatToParts(new Date(ms))) o[p.type] = p.value; return o; }
function fmtFull(ms) { const o = kst(ms); return `${o.year}.${o.month}.${o.day} ${o.hour}:${o.minute}`; }
function fmtShort(ms) {
  const o = kst(ms), n = kst(Date.now());
  if (o.year === n.year && o.month === n.month && o.day === n.day) return `오늘 ${o.hour}:${o.minute}`;
  if (o.year === n.year) return `${o.month}.${o.day}`;
  return `${o.year}.${o.month}.${o.day}`;
}
function timeEl(ms, short) { return h('time', { datetime: new Date(ms).toISOString() }, short ? fmtShort(ms) : fmtFull(ms)); }

/* ---------- API ---------- */
class ApiError extends Error {
  constructor(status, code, handled, data) { super(code); this.status = status; this.code = code; this.handled = handled; this.data = data; }
}
async function api(path, opt) {
  opt = opt || {};
  const headers = {};
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  let body;
  if (opt.body !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opt.body); }
  let res;
  try {
    res = await fetch(API_BASE + path, { method: opt.method || 'GET', headers, body, cache: 'no-store' });
  } catch (e) {
    throw new ApiError(0, 'network');
  }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && !opt.noAuthRedirect) {
    clearToken();
    state.me = null;
    state.loginError = 'session';
    renderWho();
    route();
    throw new ApiError(401, 'session', true);
  }
  if (!res.ok) throw new ApiError(res.status, (data && data.error) || 'server', false, data);
  return data;
}

/* ---------- 알림 ---------- */
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 3200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const ta = h('textarea', { readonly: true, style: 'position:fixed;top:-200px;left:0;opacity:0' });
  ta.value = text;
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

/* ---------- 화면 틀 ---------- */
function setTitle(t) { document.title = t ? `${t} · NV 클럽 공간` : 'NV 클럽 공간'; }
function show(nodes, opts) {
  view.replaceChildren();
  append(view, nodes);
  if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
  const h1 = view.querySelector('.h1');
  if (h1 && state.navigated) h1.focus({ preventScroll: true });
}
function loadingEl(msg) { return h('div', { class: 'loading', role: 'status' }, msg || '불러오는 중이에요.'); }
function errorBox(e, retry) {
  return h('div', { class: 'alert', role: 'alert' },
    h('p', { style: 'margin:0 0 10px' }, errText(e)),
    retry ? h('button', { class: 'btn btn-ghost', type: 'button', onclick: retry }, '다시 불러오기') : null);
}
function tabs(active) {
  if (!state.boards.length) return null;
  return h('nav', { class: 'tabs', 'aria-label': '게시판' },
    state.boards.map((b) => h('a', { href: `#/b/${b.slug}`, 'aria-current': b.slug === active ? 'page' : null }, b.name)));
}
function badge(text, kind) { return h('span', { class: `badge b-${kind}` }, text); }
function authorName(a) { return [h('span', { class: 'name' }, a.name), a.is_staff ? badge('운영진', 'staff') : null]; }

function renderWho() {
  const me = state.me;
  $('who').hidden = !me;
  if (!me) return;
  $('whoName').textContent = me.name;
  $('whoStaff').hidden = !me.is_staff;
  $('adminLink').hidden = !me.is_admin;
  const av = $('whoAv');
  if (me.avatar_url) { av.src = me.avatar_url; av.hidden = false; av.onerror = () => { av.hidden = true; }; }
  else av.hidden = true;
}

/* ---------- 라우팅 ---------- */
function currentNext() {
  const hsh = location.hash;
  return /^#\/[A-Za-z0-9/_-]{0,100}$/.test(hsh) && hsh !== '#/privacy' ? hsh : '#/';
}
function route() {
  const seq = ++state.seq;
  const hsh = location.hash || '#/';
  let m;
  if (hsh === '#/privacy') return renderPrivacy();
  if (!state.me) return renderLogin();
  if (hsh === '#/' || hsh === '#') {
    if (state.boards[0]) return renderBoard(state.boards[0].slug, seq);
    return show([h('h1', { class: 'h1', tabindex: '-1' }, '클럽 공간'), h('p', { class: 'desc' }, '아직 볼 수 있는 게시판이 없어요.')]);
  }
  if ((m = hsh.match(/^#\/b\/([a-z0-9-]{2,20})$/))) return renderBoard(m[1], seq);
  if ((m = hsh.match(/^#\/p\/(\d{1,15})$/))) return renderPost(+m[1], seq);
  if ((m = hsh.match(/^#\/write\/([a-z0-9-]{2,20})$/))) return renderWrite(m[1], null, seq);
  if ((m = hsh.match(/^#\/edit\/(\d{1,15})$/))) return renderEdit(+m[1], seq);
  if ((m = hsh.match(/^#\/receipts\/(\d{1,15})$/))) return renderReceipts(+m[1], seq);
  if (hsh === '#/admin' || (m = hsh.match(/^#\/admin\/(members|boards|roles)$/))) {
    if (!state.me.is_admin) return notAdmin();
    const page = m ? m[1] : 'members';
    if (page === 'boards') return renderAdminBoards(seq);
    if (page === 'roles') return renderAdminRoles(seq);
    return renderAdminMembers(seq);
  }
  return renderNotFound();

  const n = d.counts.total;

  h('span', { class: 'n' }, `${m.count}`, h('small', null, ` / ${n}명`)),

function roleColor(c) { return c ? '#' + Number(c).toString(16).padStart(6, '0') : '#6f6f6b'; }
function roleDot(r) { return h('span', { class: 'rdot', style: `background:${roleColor(r.color)}`, 'aria-hidden': 'true' }); }
/* 역할 고르기: 이름 · 색 점 · 우리 명단의 인원 */
function rolePicker(roles, selected, opts) {
  opts = opts || {};
  const sel = new Set(selected || []);
  const sum = h('p', { class: 'rp-sum' });
  const paintSum = () => {
    const names = roles.filter((r) => sel.has(r.id)).map((r) => r.name);
    sum.textContent = names.length ? `고른 역할: ${names.join(', ')}` : '아직 고른 역할이 없어요.';
  };
  const name = 'rp-' + Math.random().toString(36).slice(2, 8);
  const list = h('div', { class: 'rp-list' + (opts.compact ? ' compact' : ''), role: 'group', 'aria-label': opts.label || '역할' });
  for (const r of roles) {
    const cb = h('input', { type: 'checkbox', name, value: r.id });
    cb.checked = sel.has(r.id);
    cb.addEventListener('change', () => { if (cb.checked) sel.add(r.id); else sel.delete(r.id); paintSum(); });
    list.append(h('label', { class: 'rp-row' }, cb, roleDot(r), h('span', { class: 'rp-name' }, r.name), h('span', { class: 'rp-n' }, `${r.member_count}명`)));
  }
  if (!roles.length) list.append(h('p', { class: 'rp-none' }, '역할 목록이 비어 있어요.'));
  paintSum();
  return { el: h('div', { class: 'rp' }, sum, list), value: () => roles.filter((r) => sel.has(r.id)).map((r) => r.id) };
}

/* ---------- 멤버 관리 ---------- */
async function renderAdminMembers(seq, keep) {
  setTitle('멤버 관리');
  if (!keep) show(adminFrame('members', loadingEl()));
  let d;
  try { d = await api('/api/members'); } catch (e) {
    if (e.handled || stale(seq)) return;
    return adminFail('members', '멤버 관리', e, () => renderAdminMembers(++state.seq));
  }
  if (stale(seq)) return;
  const ui = keep || { q: '', filter: 'all', open: null };
  const strong = (m) => m.suggestions.some((s) => s.strong);
  const FILTERS = [
    { key: 'all', label: '전체', test: () => true },
    { key: 'suggest', label: '추천 있음', test: (m) => strong(m) && !m.excluded && !m.left },
    { key: 'excluded', label: '제외됨', test: (m) => m.excluded },
    { key: 'staff', label: '운영진', test: (m) => m.is_staff || m.is_admin },
    { key: 'left', label: '서버 나감', test: (m) => m.left },
  ];
  const summary = h('p', { class: 'm-summary' });
  const chips = h('div', { class: 'chips', role: 'group', 'aria-label': '멤버 거르기' });
  const count = h('p', { class: 'm-count', 'aria-live': 'polite' });
  const listEl = h('ul', { class: 'mlist' });
  const search = h('input', { class: 'input', type: 'search', id: 'm-q', placeholder: '닉네임이나 사용자명', autocomplete: 'off', spellcheck: 'false' });
  search.value = ui.q;
  search.addEventListener('input', () => { ui.q = search.value; paint(); });

  function paintSummary() {
    const s = d.summary;
    summary.replaceChildren('집계 대상 ', h('b', null, `${s.countable}명`), ' · 제외 ', h('b', null, `${s.excluded}명`), ' · 추천 ', h('b', null, `${s.suggested}명`));
  }
  function paintChips() {
    chips.replaceChildren(...FILTERS.map((f) => h('button', {
      type: 'button', class: 'chip', 'aria-pressed': ui.filter === f.key ? 'true' : 'false',
      onclick: () => { ui.filter = f.key; ui.open = null; paintChips(); paint(); },
    }, f.label, h('span', { class: 'chip-n' }, String(d.members.filter(f.test).length)))));
  }
  const matches = (m) => {
    const q = ui.q.trim().toLowerCase();
    return !q || [m.name, m.username, m.global_name].some((s) => s && s.toLowerCase().includes(q));
  };
  function paint() {
    const f = FILTERS.find((x) => x.key === ui.filter);
    const rows = d.members.filter((m) => f.test(m) && matches(m)).sort((a, b) => (a.left - b.left) || a.name.localeCompare(b.name, 'ko'));
    count.textContent = `${rows.length}명`;
    listEl.replaceChildren(...(rows.length ? rows.map(memberRow) : [h('li', { class: 'empty' }, '맞는 멤버가 없어요.')]));
  }
  async function reload() {
    d = await api('/api/members');
    paintSummary(); paintChips(); paint();
  }
  async function include(m, btn) {
    btn.disabled = true;
    try {
      await api(`/api/members/${m.id}`, { method: 'PATCH', body: { excluded: false } });
      toast(`${m.name}님을 집계에 다시 넣었어요.`);
      await reload();
    } catch (e) { if (!e.handled) { toast(adminErr(e)); btn.disabled = false; } }
  }
  function memberRow(m) {
    const av = m.avatar_url
      ? h('img', { class: 'm-av', src: m.avatar_url, alt: '', width: 40, height: 40, loading: 'lazy' })
      : h('span', { class: 'm-av m-av-x', 'aria-hidden': 'true' }, [...(m.name || '?').replace(/^NV(?=.)/, '')][0]);
    const badges = [];
    if (m.is_owner) badges.push(badge('소유자', 'admin'));
    else if (m.is_admin) badges.push(badge('관리자', 'admin'));
    if (m.is_staff) badges.push(badge('운영진', 'staff'));
    if (m.excluded) badges.push(badge(`제외됨 · ${REASON_LABEL[m.exclude_reason] || '기타'}`, 'ex'));
    if (m.left) badges.push(badge('서버 나감', 'left'));
    if (m.is_me) badges.push(badge('나', 'left'));
    const rn = m.recent_notices;
    const facts = [
      m.guild_joined_at ? `서버 가입 ${fmtDate(m.guild_joined_at)}` : '서버 가입일 모름',
      m.last_login_at ? `마지막 로그인 ${fmtDate(m.last_login_at)}` : '로그인 기록 없음',
      rn.total ? `최근 공지 열람 ${rn.opened}/${rn.total}` : '받은 공지 없음',
    ];
    let act;
    if (m.is_me) act = h('span', { class: 'm-self' }, '본인');
    else if (m.excluded) {
      act = h('button', { class: 'btn btn-ghost', type: 'button', onclick: (ev) => include(m, ev.currentTarget) }, '포함');
    } else {
      act = h('button', {
        class: 'btn btn-danger', type: 'button', 'aria-expanded': ui.open === m.id ? 'true' : 'false',
        onclick: () => { ui.open = ui.open === m.id ? null : m.id; paint(); },
      }, '제외');
    }
    return h('li', { class: 'mrow' + (m.excluded ? ' is-ex' : '') },
      h('div', { class: 'm-who' }, av, h('div', { class: 'm-id' },
        h('div', { class: 'm-name' }, h('span', { class: 'm-nm' }, m.name), badges),
        m.username ? h('div', { class: 'm-user' }, '@' + m.username) : null)),
      h('div', { class: 'm-act' }, act),
      m.suggestions.length ? h('div', { class: 'm-sugg' }, m.suggestions.map((s) => h('span', { class: 'sg ' + (s.strong ? 'sg-strong' : 'sg-weak') }, s.label_ko))) : null,
      h('p', { class: 'm-facts' }, facts.map((f, i) => [i ? ' · ' : '', h('span', { class: 'nw' }, f)])),
      m.excluded ? h('p', { class: 'm-exinfo' }, `${m.excluded_by ? m.excluded_by.name : '관리자'}님이 ${m.excluded_at ? fmtDate(m.excluded_at) : ''}에 뺐어요`, m.exclude_note ? ` · 메모: ${m.exclude_note}` : '') : null,
      ui.open === m.id ? excludePanel(m) : null);
  }
  function excludePanel(m) {
    const has = (c) => m.suggestions.some((s) => s.code === c);
    const pre = has('stream') ? 'stream' : has('dormant') ? 'dormant' : 'other';
    const gid = 'ex-' + m.id;
    const radios = [['stream', '방송용 계정'], ['dormant', '휴면 계정'], ['other', '기타']].map(([v, t]) => {
      const r = h('input', { type: 'radio', name: gid, value: v });
      r.checked = v === pre;
      return h('label', { class: 'check' }, r, t);
    });
    const note = h('input', { class: 'input', id: gid + '-note', maxlength: 100, autocomplete: 'off', placeholder: '예: 방송 시청용 부계정' });
    const staffTarget = m.is_staff || m.is_admin;
    const confirmCb = staffTarget ? h('input', { type: 'checkbox' }) : null;
    const err = h('p', { class: 'alert form-err', role: 'alert' });
    const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, '제외하기');
    const form = h('form', { class: 'm-panel', novalidate: true, 'aria-label': `${m.name} 집계에서 빼기` },
      h('fieldset', { class: 'm-reasons' }, h('legend', null, '제외 사유'), radios),
      h('div', { class: 'field' }, h('label', { for: note.id }, '메모 (선택, 100자까지)'), note, counter(note, 100)),
      staffTarget ? h('label', { class: 'check warn' }, confirmCb, '운영진 계정이에요. 그래도 집계에서 뺄게요.') : null,
      h('p', { class: 'hint' }, '공지 읽음 집계에서만 빠져요. 로그인과 글 읽기는 그대로예요. 언제든 다시 넣을 수 있어요.'),
      err,
      h('div', { class: 'actions' }, submit, h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => { ui.open = null; paint(); } }, '취소')));
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      err.textContent = '';
      const picked = form.querySelector(`input[name="${gid}"]:checked`);
      if (!picked) { err.textContent = ADMIN_ERR.bad_reason; return; }
      if (confirmCb && !confirmCb.checked) { err.textContent = ADMIN_ERR.confirm_staff; confirmCb.focus(); return; }
      submit.disabled = true;
      try {
        await api(`/api/members/${m.id}`, { method: 'PATCH', body: { excluded: true, reason: picked.value, note: note.value.trim() || undefined, confirm_staff: confirmCb ? true : undefined } });
        ui.open = null;
        toast(`${m.name}님을 집계에서 뺐어요.`);
        await reload();
      } catch (e) { if (e.handled) return; err.textContent = adminErr(e); submit.disabled = false; }
    });
    return form;
  }

  paintSummary(); paintChips(); paint();
  show(adminFrame('members', [
    adminTitle('MEMBERS', '멤버 관리', [
      '자동 추천은 표시만 해요. 실제로 빼는 건 관리자가 직접 눌러야 해요.',
      '제외한 멤버는 공지 읽음 집계에서 빠지지만, 로그인해서 글을 읽을 수는 있어요.',
    ]),
    summary,
    h('div', { class: 'm-tools' }, h('div', { class: 'field' }, h('label', { for: 'm-q' }, '멤버 찾기'), search), chips),
    count, listEl]), { keepScroll: !!keep });
}

/* ---------- 게시판 설정 ---------- */
async function renderAdminBoards(seq, keep) {
  setTitle('게시판 설정');
  if (!keep) show(adminFrame('boards', loadingEl()));
  let boards, roles, rolesErr = null;
  try {
    [boards, roles] = await Promise.all([
      api('/api/admin/boards'),
      api('/api/admin/roles').catch((e) => { if (e.handled) throw e; rolesErr = e; return { roles: [] }; }),
    ]);
  } catch (e) {
    if (e.handled || stale(seq)) return;
    return adminFail('boards', '게시판 설정', e, () => renderAdminBoards(++state.seq));
  }
  if (stale(seq)) return;
  const reload = () => renderAdminBoards(++state.seq, true);
  show(adminFrame('boards', [
    adminTitle('BOARDS', '게시판 설정', [
      '게시판마다 누가 읽고, 쓰고, 댓글을 달 수 있는지 정해요. 저장하면 바로 적용돼요.',
      '운영진과 관리자는 ‘특정 역할’ 게시판도 볼 수 있어요. 게시판은 지우지 않고 숨겨요. 숨겨도 글은 남아요.',
    ]),
    rolesErr ? h('p', { class: 'alert', role: 'alert' }, '디스코드 역할 목록을 불러오지 못했어요. 지금은 ‘특정 역할’을 고를 수 없어요.') : null,
    h('div', { class: 'b-list' }, boards.boards.map((b) => boardEditor(b, roles.roles, false, reload))),
    h('h2', { class: 'sub-h' }, '새 게시판'),
    boardEditor(null, roles.roles, true, reload)]), { keepScroll: !!keep });
}
function policyField(k, d, roles, uid) {
  const LABEL = { read: '읽기', write: '쓰기', comment: '댓글' };
  const id = `bp-${k}-${uid}`;
  const sel = h('select', { class: 'input select', id }, ['members', 'staff', 'admin', 'roles'].map((v) => h('option', { value: v }, POLICY_LABEL[v])));
  sel.value = d[`${k}_policy`];
  const picker = rolePicker(roles, d[`${k}_roles`], { compact: true, label: `${LABEL[k]}할 수 있는 역할` });
  picker.el.hidden = sel.value !== 'roles';
  sel.addEventListener('change', () => { picker.el.hidden = sel.value !== 'roles'; });
  return {
    el: h('div', { class: 'field b-pol' }, h('label', { for: id }, LABEL[k]), sel, picker.el),
    get: () => ({ [`${k}_policy`]: sel.value, [`${k}_roles`]: sel.value === 'roles' ? picker.value() : [] }),
  };
}
function toggle(cb, title, help) {
  return h('label', { class: 'check tgl' }, cb, h('span', null, title, h('small', null, help)));
}
function boardEditor(b, roles, isNew, reload) {
  const d = b || { slug: '', name: '', read_policy: 'members', read_roles: [], write_policy: 'members', write_roles: [], comment_policy: 'members', comment_roles: [], private_own: false, receipts_enabled: false, sort_order: '', hidden: false, post_count: 0 };
  const uid = isNew ? 'new' : d.slug;
  const slug = isNew ? h('input', { class: 'input', id: `bs-${uid}`, maxlength: 20, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: '예: league' }) : null;
  const name = h('input', { class: 'input', id: `bn-${uid}`, maxlength: 20, autocomplete: 'off' });
  name.value = d.name;
  const order = h('input', { class: 'input', id: `bo-${uid}`, type: 'number', min: 0, max: 999, inputmode: 'numeric' });
  order.value = d.sort_order === '' ? '' : String(d.sort_order);
  const pols = ['read', 'write', 'comment'].map((k) => policyField(k, d, roles, uid));
  const own = h('input', { type: 'checkbox' }); own.checked = !!d.private_own;
  const rc = h('input', { type: 'checkbox' }); rc.checked = !!d.receipts_enabled;
  const hid = isNew ? null : h('input', { type: 'checkbox' });
  if (hid) hid.checked = !!d.hidden;
  const err = h('p', { class: 'alert form-err', role: 'alert' });
  const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, isNew ? '게시판 만들기' : '저장');
  const form = h('form', { class: 'panel b-edit' + (d.hidden ? ' is-hidden' : ''), novalidate: true, 'aria-labelledby': `bh-${uid}` },
    h('div', { class: 'b-head' },
      h('h3', { class: 'h3', id: `bh-${uid}` }, isNew ? '새 게시판 만들기' : d.name),
      isNew ? null : h('span', { class: 'b-meta' }, `#/b/${d.slug} · 글 ${d.post_count}개`, d.hidden ? badge('숨김', 'hidden') : null)),
    h('div', { class: 'b-grid' },
      slug ? h('div', { class: 'field f-slug' }, h('label', { for: slug.id }, '주소 (영어 소문자·숫자·-, 2~20자)'), slug) : null,
      h('div', { class: 'field' }, h('label', { for: name.id }, '이름'), name),
      h('div', { class: 'field' }, h('label', { for: order.id }, '순서'), order)),
    h('div', { class: 'b-pols' }, pols.map((p) => p.el)),
    h('div', { class: 'b-toggles' },
      toggle(own, '작성자 본인 글은 볼 수 있음', '읽기가 막혀 있어도 쓴 사람은 자기 글과 답을 봐요. 건의사항이 이렇게 돼 있어요.'),
      toggle(rc, '읽음 확인 집계', '‘확인했어요’ 버튼과 읽음 현황을 써요. 공지사항이 이렇게 돼 있어요.'),
      hid ? toggle(hid, '숨기기', '탭에서 빠져요. 글은 지우지 않아요.') : null),
    err,
    h('div', { class: 'actions' }, submit));
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const body = { name: name.value.trim(), private_own: own.checked, receipts_enabled: rc.checked };
    if (order.value !== '') body.sort_order = Number(order.value);
    for (const p of pols) Object.assign(body, p.get());
    if (hid) body.hidden = hid.checked;
    if (isNew) body.slug = slug.value.trim();
    if (isNew && !/^[a-z0-9-]{2,20}$/.test(body.slug)) { err.textContent = ADMIN_ERR.bad_slug; slug.focus(); return; }
    if (!body.name) { err.textContent = ADMIN_ERR.name_required; name.focus(); return; }
    submit.disabled = true;
    try {
      if (isNew) await api('/api/admin/boards', { method: 'POST', body });
      else await api(`/api/admin/boards/${d.slug}`, { method: 'PATCH', body });
      await loadBoards();
      toast(isNew ? '게시판을 만들었어요.' : `${body.name} 설정을 저장했어요.`);
      reload();
    } catch (e) { if (e.handled) return; err.textContent = adminErr(e); submit.disabled = false; }
  });
  return form;
}

/* ---------- 권한 설정 ---------- */
async function renderAdminRoles(seq, keep) {
  setTitle('권한 설정');
  if (!keep) show(adminFrame('roles', loadingEl()));
  let st, rl;
  try { [st, rl] = await Promise.all([api('/api/admin/settings'), api('/api/admin/roles')]); } catch (e) {
    if (e.handled || stale(seq)) return;
    return adminFail('roles', '권한 설정', e, () => renderAdminRoles(++state.seq));
  }
  if (stale(seq)) return;
  const staffP = rolePicker(rl.roles, st.staff_role_ids, { label: '운영진 역할' });
  const adminP = rolePicker(rl.roles, st.admin_role_ids, { label: '관리자 역할' });
  const err = h('p', { class: 'alert form-err', role: 'alert' });
  const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, '권한 저장');
  const owners = st.owners.map((o) => o.name || `아이디 ${o.id}`).join(', ');
  const form = h('form', { class: 'form', novalidate: true },
    h('section', { class: 'panel', 'aria-labelledby': 'r-staff' },
      h('h2', { class: 'h2', id: 'r-staff' }, '운영진으로 인정할 디스코드 역할'),
      h('p', { class: 'hint', style: 'margin-bottom:12px' }, '공지 쓰기, 글 숨기기와 지우기, 읽음 현황, 건의사항 읽기를 할 수 있어요.'),
      staffP.el),
    h('section', { class: 'panel', 'aria-labelledby': 'r-admin' },
      h('h2', { class: 'h2', id: 'r-admin' }, '관리 페이지에 들어올 수 있는 디스코드 역할'),
      h('p', { class: 'hint', style: 'margin-bottom:12px' }, '멤버 관리, 게시판 설정, 권한 설정을 할 수 있어요. 관리자는 운영진이 하는 일도 모두 할 수 있어요.'),
      adminP.el),
    err,
    h('div', { class: 'actions' }, submit));
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const staff = staffP.value();
    if (!staff.length) { err.textContent = ADMIN_ERR.no_staff_roles; return; }
    submit.disabled = true;
    try {
      const r = await api('/api/admin/settings', { method: 'PUT', body: { staff_role_ids: staff, admin_role_ids: adminP.value() } });
      toast(`저장했어요. ${r.recomputed}명의 권한을 바로 바꿨어요.`);
      state.me = (await api('/api/me')).me;
      renderWho();
      await loadBoards();
      if (!state.me.is_admin) return route();
      renderAdminRoles(++state.seq, true);
    } catch (e) { if (e.handled) return; err.textContent = adminErr(e); submit.disabled = false; }
  });
  show(adminFrame('roles', [
    adminTitle('ROLES', '권한 설정', [
      '디스코드 역할로 운영진과 관리자를 정해요. 저장하면 사이트에 저장된 역할 정보로 바로 다시 계산해요.',
      '역할 옆 숫자는 이 사이트 명단에 있는 사람 수예요.',
    ]),
    h('p', { class: 'owner-note' }, '소유자(사이트를 만든 사람)는 항상 관리자예요.', owners ? ` 지금 소유자: ${owners}` : ''),
    form]), { keepScroll: !!keep });
}

/* ---------- 시작 ---------- */
$('logoutBtn').addEventListener('click', async () => {
  try { await api('/api/session', { method: 'DELETE', noAuthRedirect: true }); } catch (e) {}
  clearToken();
  state.me = null;
  state.loginError = null;
  renderWho();
  history.replaceState(null, '', location.pathname + location.search + '#/');
  route();
  toast('로그아웃했어요.');
});

/* 디스코드 로그인 뒤 돌아온 #ticket=… / #error=… 를 읽고 주소에서 바로 지운다 */
async function consumeAuthFragment() {
  const raw = location.hash.slice(1);
  if (/^(ticket|error)=/.test(raw)) {
    const p = new URLSearchParams(raw);
    history.replaceState(null, '', location.pathname + location.search);
    if (p.get('error')) {
      state.loginError = p.get('error');
    } else {
      show(loadingEl('로그인하는 중이에요.'));
      try {
        const r = await api('/api/session', { method: 'POST', body: { ticket: p.get('ticket') || '' }, noAuthRedirect: true });
        saveToken(r.token);
        state.me = r.me;
        history.replaceState(null, '', location.pathname + location.search + (r.next || '#/'));
      } catch (e) {
        state.loginError = e.code === 'not_member' ? 'not_member' : e.code === 'ticket' ? 'ticket' : 'server';
      }
    }
  }
}

async function boot() {
  await consumeAuthFragment();
  if (!state.token) state.token = loadToken();
  if (state.token && !state.me) {
    show(loadingEl());
    try {
      state.me = (await api('/api/me', { noAuthRedirect: true })).me;
    } catch (e) {
      if (e.status === 401) { clearToken(); state.loginError = 'session'; }
      else { renderWho(); return show([h('h1', { class: 'h1', tabindex: '-1', style: 'margin-bottom:16px' }, '클럽 공간'), errorBox(e, () => location.reload())]); }
    }
  }
  if (state.me) {
    try { await loadBoards(); } catch (e) {
      if (!e.handled) { renderWho(); return show([h('h1', { class: 'h1', tabindex: '-1', style: 'margin-bottom:16px' }, '클럽 공간'), errorBox(e, () => location.reload())]); }
    }
  }
  renderWho();
  window.addEventListener('hashchange', async () => {
    state.navigated = true;
    if (/^#(ticket|error)=/.test(location.hash)) { await consumeAuthFragment(); if (state.me) { try { await loadBoards(); } catch (e) {} } renderWho(); }
    route();
  });
  route();
}
boot();
</script>
