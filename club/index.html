<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NV 클럽 공간</title>
<meta name="description" content="NV 클럽 멤버 전용 공간 — 공지사항, 건의사항, 자유게시판">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://cdn.discordapp.com https://fco.dn.nexoncdn.co.kr https://ssl.nexon.com data:; connect-src 'self' https://*.workers.dev https://open.api.nexon.com http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Michroma&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --ink: #d8d8d6;
    --ink-hi: #f3f3f1;
    --ink-mid: #c4c4c1;
    --ink-dim: #9a9a96;
    --red-top: #a0071e;
    --red-mid: #c92d3f;
    --red-bot: #e64a58;
    --red-soft: #ffb3ba;
    --sky: #44a0c0;
    --line: rgba(230, 74, 88, 0.34);
    --line-soft: rgba(230, 74, 88, 0.16);
    --glass: rgba(14, 8, 10, 0.78);
    --glass-edge: rgba(216, 216, 214, 0.1);
    --rule: rgba(216, 216, 214, 0.1);
    --f-lat: 'Michroma', 'Eurostile', 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --f-kr: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    --gut-l: max(16px, env(safe-area-inset-left, 0px));
    --gut-r: max(16px, env(safe-area-inset-right, 0px));
  }
  @media (min-width: 760px) {
    :root {
      --gut-l: max(32px, env(safe-area-inset-left, 0px));
      --gut-r: max(32px, env(safe-area-inset-right, 0px));
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse 70% 320px at 50% -60px, rgba(160, 7, 30, 0.32), rgba(160, 7, 30, 0) 75%),
      radial-gradient(ellipse 40% 260px at 92% 8%, rgba(68, 160, 192, 0.06), rgba(0, 0, 0, 0) 70%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--f-kr); font-size: 16px; line-height: 1.7;
    word-break: keep-all; overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  a { color: inherit; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 2px; }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .skip {
    position: absolute; left: var(--gut-l); top: -60px; z-index: 50;
    padding: 10px 14px; background: #000; color: var(--ink-hi); border: 1px solid var(--sky);
  }
  .skip:focus { top: 8px; }
  .wrap {
    width: 100%; max-width: 920px; margin: 0 auto;
    padding-inline: var(--gut-l) var(--gut-r);
  }

  /* ---------- 상단 ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(0, 0, 0, 0.72);
    border-bottom: 1px solid var(--line-soft);
    -webkit-backdrop-filter: blur(14px) saturate(130%);
    backdrop-filter: blur(14px) saturate(130%);
  }
  .top-in { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; flex: none;
    min-height: 44px; text-decoration: none; color: var(--ink-hi);
    font-family: var(--f-lat); font-size: 15px; letter-spacing: 0.14em;
  }
  .brand img { width: 30px; height: 30px; display: block; filter: drop-shadow(0 0 10px rgba(230, 74, 88, 0.45)); }
  .brand-sub { font-size: 10px; letter-spacing: 0.3em; color: var(--red-bot); padding-left: 2px; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who-av { width: 28px; height: 28px; border-radius: 50%; flex: none; background: #1a1012; }
  .who-name {
    min-width: 0; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 14.5px; font-weight: 600; color: var(--ink-hi);
  }

  /* ---------- 공통 ---------- */
  main { flex: 1 0 auto; padding-block: 24px 72px; }
  main:focus { outline: none; }
  .idx {
    display: inline-flex; align-items: center; gap: 12px; margin: 0 0 8px;
    font-family: var(--f-lat); font-size: 10.5px; letter-spacing: 0.3em; color: var(--red-bot);
  }
  .idx::after { content: ''; width: 36px; height: 1px; background: linear-gradient(90deg, var(--red-bot), rgba(230, 74, 88, 0)); }
  .h1 { margin: 0; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; color: var(--ink-hi); }
  .h1:focus { outline: none; }
  .h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; color: var(--ink-hi); }
  .desc { margin: 6px 0 0; font-size: 14.5px; line-height: 1.65; color: var(--ink-dim); max-width: 40em; }
  .muted { color: var(--ink-dim); }
  .panel {
    position: relative; background: var(--glass); border: 1px solid var(--glass-edge);
    padding: clamp(18px, 3vw, 28px);
  }
  .hud::before, .hud::after { content: ''; position: absolute; width: 14px; height: 14px; pointer-events: none; }
  .hud::before { top: -1px; left: -1px; border-top: 1px solid var(--red-bot); border-left: 1px solid var(--red-bot); }
  .hud::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--red-bot); border-right: 1px solid var(--red-bot); }

  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 18px; border-radius: 2px; border: 0; cursor: pointer;
    font-size: 15px; font-weight: 600; line-height: 1.2; text-decoration: none; color: #fff;
    white-space: nowrap; transition: box-shadow 0.2s ease, background-color 0.2s ease, transform 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(170deg, #b8142c 0%, #a0071e 45%, #c92d3f 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 140, 150, 0.32), 0 10px 30px -14px rgba(230, 74, 88, 0.9);
  }
  .btn-primary:hover { box-shadow: inset 0 0 0 1px rgba(255, 160, 170, 0.6), 0 0 26px rgba(230, 74, 88, 0.45); }
  .btn-ghost { color: var(--ink-hi); background: rgba(0, 0, 0, 0.35); box-shadow: inset 0 0 0 1px rgba(216, 216, 214, 0.3); }
  .btn-ghost:hover { box-shadow: inset 0 0 0 1px rgba(230, 74, 88, 0.75); }
  .btn-sky { color: var(--ink-hi); background: rgba(68, 160, 192, 0.1); box-shadow: inset 0 0 0 1px rgba(68, 160, 192, 0.55); }
  .btn-sky:hover { background: rgba(68, 160, 192, 0.18); }
  .btn-danger { color: var(--red-soft); background: transparent; box-shadow: inset 0 0 0 1px rgba(230, 74, 88, 0.45); }
  .btn-danger:hover { background: rgba(160, 7, 30, 0.2); }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .btn-text {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px;
    background: none; border: 0; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink-mid);
    text-decoration: none; border-radius: 2px;
  }
  .btn-text:hover { color: var(--ink-hi); text-decoration: underline; text-underline-offset: 4px; }
  .btn-text.danger { color: var(--red-soft); }
  .btn-wide { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .badge {
    display: inline-flex; align-items: center; height: 22px; padding: 0 7px; flex: none;
    font-size: 12px; font-weight: 600; line-height: 1; border-radius: 2px; white-space: nowrap;
    border: 1px solid rgba(216, 216, 214, 0.25); color: var(--ink-mid);
  }
  .b-pin { color: var(--red-soft); border-color: rgba(230, 74, 88, 0.5); background: rgba(160, 7, 30, 0.2); }
  .b-todo { color: #8fd3ea; border-color: rgba(68, 160, 192, 0.6); background: rgba(68, 160, 192, 0.1); }
  .b-hidden { color: var(--ink-dim); border-style: dashed; }
  .b-pub { color: #e6cf8f; border-color: rgba(230, 207, 143, 0.5); background: rgba(230, 207, 143, 0.08); }
  .pub-hint { color: #e6cf8f; }
  .b-anon { color: #8fd3ea; border-color: rgba(68, 160, 192, 0.6); background: rgba(68, 160, 192, 0.1); }
  .anon-box { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 14px; align-items: start; margin: 0 0 22px; padding: 18px 20px;
    border: 1px solid rgba(68, 160, 192, 0.55); border-left-width: 4px; background: rgba(68, 160, 192, 0.1); }
  .anon-box > svg { width: 28px; height: 28px; color: #8fd3ea; margin-top: 1px; }
  .anon-box strong { display: block; font-size: 18px; line-height: 1.4; color: #fff; }
  .anon-box p { margin: 4px 0 0; font-size: 15px; line-height: 1.65; color: var(--ink-mid); }
  .anon-name { display: inline-flex; align-items: center; gap: 5px; color: #8fd3ea; }
  .anon-name svg { width: 15px; height: 15px; flex: none; }
  .intro { margin: 8px 0 0; font-size: 16.5px; line-height: 1.6; font-weight: 600; color: var(--ink-hi); max-width: 40em; }
  /* 메모 벽 */
  .memo-new { margin: 0 0 22px; padding: 18px 20px; }
  .memo-label { display: block; margin: 0 0 8px; font-size: 14px; font-weight: 700; color: var(--ink-mid); }
  .memo-input { min-height: 96px; }
  .memo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .memo-wall { list-style: none; margin: 0; padding: 0; columns: 3 240px; column-gap: 14px; }
  .memo {
    --tone: 230, 74, 88;
    break-inside: avoid; display: flex; flex-direction: column; gap: 12px; margin: 0 0 14px; padding: 16px 16px 12px;
    background: linear-gradient(180deg, rgba(var(--tone), 0.16), rgba(var(--tone), 0.07));
    border: 1px solid rgba(var(--tone), 0.38); border-top: 3px solid rgba(var(--tone), 0.85); border-radius: 4px;
  }
  .memo.tone-1 { --tone: 68, 160, 192; }
  .memo.tone-2 { --tone: 230, 207, 143; }
  .memo.tone-3 { --tone: 120, 200, 140; }
  .memo.tone-4 { --tone: 190, 150, 240; }
  .memo.is-hidden { opacity: 0.55; border-style: dashed; }
  .memo-marks { display: flex; gap: 6px; }
  .memo-body { margin: 0; font-size: 16px; line-height: 1.65; color: #fff; white-space: pre-wrap; overflow-wrap: anywhere; }
  .memo-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; font-size: 13px; color: var(--ink-dim); }
  .memo-who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--ink-mid); font-weight: 600; }
  .memo-me { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); color: #fff; }
  .memo-tools { display: flex; justify-content: flex-end; gap: 14px; margin-top: -4px; }
  .memo-discuss { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 8px 0; border-top: 1px solid rgba(var(--tone), 0.3); font-size: 13.5px; font-weight: 600; color: var(--ink-hi); text-decoration: none; }
  .memo-discuss:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
  .memo-discuss svg { flex: none; width: 16px; height: 16px; }
  .memo-empty { column-span: all; padding: 36px 6px; color: var(--ink-dim); font-size: 15px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  @media (max-width: 520px) { .memo-wall { columns: 1; } }
  .b-staff { height: 20px; padding: 0 6px; font-size: 11.5px; color: var(--red-soft); border-color: rgba(230, 74, 88, 0.4); }
  .b-left { height: 20px; padding: 0 6px; font-size: 11.5px; color: var(--ink-dim); }

  .alert { margin: 0 0 16px; padding: 12px 14px; border: 1px solid rgba(230, 74, 88, 0.5); background: rgba(160, 7, 30, 0.14); color: var(--ink-hi); font-size: 15px; }
  .info { margin: 0 0 16px; padding: 12px 14px; border: 1px solid rgba(68, 160, 192, 0.4); background: rgba(68, 160, 192, 0.07); color: var(--ink); font-size: 14.5px; }

  .loading { display: flex; align-items: center; gap: 12px; padding: 40px 0; color: var(--ink-dim); font-size: 15px; }
  .loading::before {
    content: ''; width: 18px; height: 18px; border-radius: 50%; flex: none;
    border: 2px solid rgba(230, 74, 88, 0.25); border-top-color: var(--red-bot);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .loading::before { animation: none; } * { transition: none !important; } }

  /* ---------- 탭 ---------- */
  /* 칸은 똑같이 나누되 글자보다 좁아지지 않게. 탭이 많아 넘치면 탭 줄만 옆으로 밀린다 */
  .tabs {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(max-content, 1fr);
    margin: 0 0 26px; box-shadow: inset 0 -1px 0 var(--rule);
    overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a {
    position: relative; display: flex; align-items: center; justify-content: center;
    min-height: 50px; padding: 0 6px; text-decoration: none; text-align: center; white-space: nowrap;
    font-size: 15.5px; font-weight: 600; color: var(--ink-dim);
  }
  .tabs a:focus-visible { outline-offset: -3px; }
  .tabs a:hover { color: var(--ink-hi); }
  .tabs a[aria-current="page"] { color: var(--ink-hi); }
  .tabs a[aria-current="page"]::after {
    content: ''; position: absolute; left: 12%; right: 12%; bottom: 0; height: 2px;
    background: linear-gradient(90deg, var(--red-top), var(--red-bot));
  }

  /* ---------- 목록 ---------- */
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 20px; margin: 0 0 20px; }
  .head > div { min-width: 0; flex: 1 1 320px; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 18px;
    min-height: 68px; padding: 12px 6px; border-bottom: 1px solid var(--rule);
    text-decoration: none; color: inherit; transition: background-color 0.2s ease;
  }
  .row:hover { background: rgba(230, 74, 88, 0.05); }
  .row-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-width: 0; }
  .row-title { font-size: 16.5px; font-weight: 600; color: var(--ink-hi); line-height: 1.45; overflow-wrap: anywhere; min-width: 0; }
  .row-meta { grid-column: 1; font-size: 13px; color: var(--ink-dim); }
  .row-rc {
    grid-column: 2; grid-row: 1 / span 2; justify-self: end; text-align: right;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-mid); font-variant-numeric: tabular-nums;
  }
  .row-rc b { color: var(--ink-hi); font-weight: 600; }
  .empty { padding: 36px 6px; border-bottom: 1px solid var(--rule); color: var(--ink-dim); font-size: 15px; }
  .more { display: flex; justify-content: center; margin-top: 18px; }
  .sub-h { margin: 34px 0 10px; font-size: 16px; font-weight: 700; color: var(--ink-hi); }
  @media (max-width: 560px) {
    .row { grid-template-columns: minmax(0, 1fr); }
    .row-rc { grid-column: 1; grid-row: auto; justify-self: start; text-align: left; }
  }

  /* ---------- 글 ---------- */
  .back {
    display: flex; width: fit-content; align-items: center; gap: 6px; min-height: 44px; margin: 0 0 6px -4px; padding: 0 4px;
    font-size: 14.5px; color: var(--ink-mid); text-decoration: none;
  }
  .back:hover { color: var(--ink-hi); }
  .back svg { width: 16px; height: 16px; }
  .post-badges { display: flex; gap: 6px; margin: 0 0 10px; }
  .post-title { overflow-wrap: anywhere; }
  .post-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 10px 0 0; font-size: 14px; color: var(--ink-dim); }
  .post-meta .name { color: var(--ink-mid); font-weight: 600; }
  .post-body {
    margin: 22px 0 0; padding: 22px 0 0; border-top: 1px solid var(--rule);
    font-size: 16.5px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .post-body a, .c-body a { color: #8fd3ea; text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }
  .ack {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px;
    margin: 26px 0 0; padding: 16px 18px; border: 1px solid rgba(68, 160, 192, 0.4); background: rgba(68, 160, 192, 0.07);
  }
  .ack p { margin: 0; font-size: 15px; color: var(--ink); }
  .ack.done { justify-content: flex-start; color: #8fd3ea; font-weight: 600; font-size: 15px; }
  .ack.done svg { width: 20px; height: 20px; flex: none; }
  .staff-tools {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 16px 0 0; padding: 14px 0 0;
    border-top: 1px dashed rgba(230, 74, 88, 0.25);
  }
  .staff-tools .lbl { font-family: var(--f-lat); font-size: 10px; letter-spacing: 0.26em; color: var(--red-bot); margin-right: 4px; }
  .manage { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0 4px; margin: 14px -10px 0 0; }

  /* ---------- 댓글 ---------- */
  .comments { margin-top: 34px; }
  .c-list { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--rule); }
  .c-item { padding: 14px 0 10px; border-bottom: 1px solid var(--rule); }
  .c-item.staff-reply { border-left: 2px solid rgba(230, 74, 88, 0.55); padding-left: 14px; background: linear-gradient(90deg, rgba(160, 7, 30, 0.1), rgba(160, 7, 30, 0) 60%); }
  .c-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
  .c-head .name { font-weight: 600; color: var(--ink-hi); }
  .c-head time { color: var(--ink-dim); font-size: 13px; }
  .c-body { margin: 4px 0 0; font-size: 15.5px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .c-tools { display: flex; justify-content: flex-end; gap: 0 2px; margin: 0 -10px 0 0; }
  .c-tools .btn-text { min-height: 40px; font-size: 13.5px; }

  /* ---------- 입력 ---------- */
  .form { display: grid; gap: 18px; }
  .field { display: grid; gap: 6px; }
  .field label, .field .lab { font-size: 14px; font-weight: 600; color: var(--ink-mid); }
  .input, .textarea {
    width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 2px;
    font-size: 16px; line-height: 1.6; color: var(--ink-hi);
    background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(216, 216, 214, 0.2);
  }
  .textarea { min-height: 220px; resize: vertical; }
  .textarea.short { min-height: 96px; }
  .input:focus-visible, .textarea:focus-visible { border-color: var(--sky); outline: 2px solid var(--sky); outline-offset: 0; }
  .input::placeholder, .textarea::placeholder { color: #7d7d79; }
  .count { justify-self: end; font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--red-soft); }
  .hint { margin: 0; font-size: 13.5px; color: var(--ink-dim); }
  .check { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-size: 15px; }
  .check input { width: 20px; height: 20px; accent-color: var(--red-mid); }
  .form-err:empty { display: none; }
  .c-form { display: grid; gap: 8px; }
  .c-form .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* ---------- 읽음 현황 ---------- */
  .rc-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 18px; }
  .rc-tab {
    display: grid; gap: 4px; align-content: center; min-height: 76px; padding: 12px 16px; text-align: left; cursor: pointer;
    background: rgba(255, 255, 255, 0.025); border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-mid);
  }
  .rc-tab .t { font-size: 14.5px; font-weight: 600; }

  /* 최근 경기 선발: 위쪽이 상대 골문 */

  .pitch {

  .pk-sub { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 30px; align-items: center; column-gap: 8px; min-height: 44px; border-top: 1px solid rgba(216, 216, 214, 0.07); font-size: 14px; color: var(--ink-hi); }

  .pf { position: relative; flex: none; display: block; overflow: hidden; border-radius: 2px; background: radial-gradient(circle at 50% 40%, rgba(216, 216, 214, 0.1), rgba(216, 216, 214, 0.03) 70%); }

  .pm.r-d { background: linear-gradient(90deg, rgba(216, 216, 214, 0.08), rgba(216, 216, 214, 0.015) 70%); box-shadow: inset 3px 0 0 rgba(216, 216, 214, 0.5); }

  .tmini { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }

  /* ---------- 최고의 선수 ---------- */

  /* ---------- 2대2 ---------- */

/* 위 세 디비전은 게임 사진을 보고 그린 SVG 배지. 슈퍼 챌린지 아래 18개는 FC온라인 데이터센터가 쓰는 공식 그림

const TIER_ART = { 800: 'tb-superchamp', 900: 'tb-champ', 1000: 'tb-superchal' };

  nexon_not_found: '그 닉네임을 찾지 못했어요. 게임에 보이는 닉네임과 똑같은지 확인해 주세요.',

};
const statsErr = (e) => STATS_ERR[e && e.code] || errText(e);
const SYNC_STOP = { budget: '오늘 쓸 수 있는 호출을 다 써서 중간에 멈췄어요', rate: '넥슨 호출 제한에 걸려 중간에 멈췄어요', error: '넥슨 쪽 오류로 중간에 멈췄어요' };

const winSize = (d) => (d && d.window && isNum(d.window.size) ? d.window.size : isNum(d && d.window) ? d.window : STATS_WINDOW);
/* 30경기 기록을 다시 모으는 동안(서버 window.ready=false)은 옛 10경기 기준으로 보여 준다는 안내 */
function refillNote(d, rule) {
  const w = d && d.window;
  if (!w || typeof w !== 'object' || w.ready !== false) return null;
  const head = `최근 ${w.size}경기 기록을 다시 모으는 중이에요(${w.done ?? 0}/${w.total ?? 0}명).`;
  return h('p', { class: 'pm-partial' }, rule
    ? `${head} 대부분 모이면 ${w.size}경기 기준으로 바뀌고, 그때까지는 ${rule} 기준으로 보여 줘요.`
    : `${head} 아직 10경기 기록인 클럽원도 섞여 있어요.`);
}
/* 개인 전적·검색: 서버는 한 번에 새 경기 10개까지만 받아 오고 남은 수를 pending으로 알려 준다. 두 번까지 이어 받는다 */
async function fillPending(url, d, seq, repaint) {
  /* 넥슨이 중간에 멈췄으면(stopped) 바로 다시 물어도 같으니 이어 받지 않는다. 고장 난 경기 몇 개를 건너뛴 것(skipped)은
     나머지를 받는 데 지장이 없어 계속 이어 받는다. 이어 받기는 cont=1: 방금 낸 조회 횟수로 친다 */
  const halted = (x) => (typeof x.stopped === 'boolean' ? x.stopped : !!x.partial);
  const contUrl = `${url}${url.includes('?') ? '&' : '?'}cont=1`;
  for (let i = 0; i < 2 && d && d.pending > 0 && !halted(d); i++) {
    let next;
    try { next = await api(contUrl); } catch (e) { return (e && e.code) || 'error'; }
    if (stale(seq)) return 'stale';
    const before = Array.isArray(d.matches) ? d.matches.length : 0;
    const after = next && Array.isArray(next.matches) ? next.matches.length : 0;
    if (!next || (after <= before && !(next.pending < d.pending))) break; // 더 못 받았으면 멈춘다
    d = next;
    await repaint(d);
    if (stale(seq)) return 'stale';
  }
  return 'done';
}
/* 이어 받은 뒤 본문만 다시 그릴 때, 보던 자리(경기 줄의 라인업·상대 링크, 더 보기)에 포커스를 돌려 준다 */
function keepFocusIn(box, redraw) {
  const ae = document.activeElement;
  /* 화면 위쪽에서 처음 보이는 경기 줄(없으면 제목)의 위치를 기억했다가, 다시 그린 뒤 같은 자리로 맞춘다 */
  const anchorOf = (root) => [...root.querySelectorAll('li[data-mid], h2[id]')].find((el) => el.getBoundingClientRect().top >= 0) || null;
  const a = anchorOf(box);
  const aKey = a ? (a.dataset.mid ? `li[data-mid="${CSS.escape(a.dataset.mid)}"]` : `#${CSS.escape(a.id)}`) : null;
  const aTop = a ? a.getBoundingClientRect().top : 0;
  let key = null;
  if (ae && box.contains(ae)) {
    const li = ae.closest('li[data-mid]');
    key = { mid: li ? li.dataset.mid : null, sel: ae.matches('summary') ? 'summary' : ae.matches('a') ? 'a' : ae.closest('.more') ? 'more' : null };
  }
  redraw();
  const b = aKey ? box.querySelector(aKey) : null;
  if (b) { const dy = b.getBoundingClientRect().top - aTop; if (Math.abs(dy) > 1) window.scrollBy(0, dy); }
  if (!key) return;
  let el = null;
  if (key.sel === 'more') el = box.querySelector('.more button');
  else if (key.mid) { const li = box.querySelector(`li[data-mid="${CSS.escape(key.mid)}"]`); el = li && key.sel ? li.querySelector(key.sel) : null; }
  if (el) el.focus({ preventScroll: true });
}

function tierSvg(div) {
  if (!TIER_ART[div] && TIER_IMG.has(div)) return h('img', { class: 'tb tb-img', src: `tiers/${div}.png`, alt: '', width: 80, height: 80, decoding: 'async' });
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'tb'); s.setAttribute('viewBox', '0 0 120 120'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('focusable', 'false');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#' + TIER_ART[div]); u.setAttribute('width', '120'); u.setAttribute('height', '120');
  s.append(u);
  return s;
}
const linkKey = (link) => (link ? link.status : 'none');
/* 티어 글자: 그림이 있는 네 디비전은 색 글자, 나머지는 글자 알약, 연결 전·실패는 점선 알약 */
function tierLabel(link, divs) {
  if (!link || link.status !== 'ok') return badge(LINK_STATE[linkKey(link)] || LINK_STATE.none, 'state');
  const dv = link.best_division;
  if (dv == null) return badge('티어 기록 없음', 'state');
  const name = divs.get(dv) || `디비전 ${dv}`;
  return hasTierArt(dv) ? h('span', { class: `tn tn-${dv}` }, name) : badge(name, 'div');
}
/* 글줄 안에서 ' · '로 잇는다(줄바꿈은 띄어쓰기에서) */
function dotted(items) {
  const out = [];
  items.filter(Boolean).forEach((x, i) => { if (i) out.push(' · '); out.push(x); });
  return out;
}
function fmtDay(ms) { return typeof ms === 'number' && isFinite(ms) ? fmtDate(ms) : null; }
function signed(n) { return n > 0 ? `+${n}` : String(n); }
function syncSummary(r) {
  const n = (x) => (typeof x === 'number' ? x.toLocaleString('ko-KR') : '0');
  const s = `새로 받았어요. 연결 ${n(r.linked)}명 · 못 찾음 ${n(r.not_found)}명 · 티어 ${n(r.tiers)}명 · 경기 ${n(r.scanned)}개 확인 · 상세 ${n(r.details)}개 · 호출 ${n(r.used)}회.`;
  return r.stopped ? `${s} ${SYNC_STOP[r.stopped] || '중간에 멈췄어요'}.` : s;
}

/* 닉네임 입력 폼(내 칸, 운영진 고치기 공용). save()가 실패하면 폼 안에 이유를 보여 준다 */
function nickForm(o) {
  const id = 'nk-' + o.key;
  const input = h('input', { class: 'input', id, maxlength: 30, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'done', placeholder: '게임에 보이는 닉네임' });
  input.value = o.value || '';
  const err = h('p', { class: 'alert form-err', role: 'alert' });
  const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, '저장');
  const form = h('form', { class: o.cls, novalidate: true, 'aria-label': o.label },
    h('div', { class: 'field' }, h('label', { for: id }, '게임 닉네임'), input),
    o.hint ? h('p', { class: 'hint' }, o.hint) : null,
    err,

      o.onCancel ? h('button', { class: 'btn btn-ghost', type: 'button', onclick: o.onCancel }, '취소') : null, o.extra || null));
  form.addEventListener('submit', async (ev) => {

/* DUO_MODEL_START
 * 정규화된 입력: members=[{id,name}], matches=[{id,at,teams:[{ids:[id,id],score}, ...]}].
 * 넥슨 응답 형식을 가정하지 않는다. 같은 편이 확인된 경기만 이 형식으로 변환할 수 있다.
 * 계정별/조합별 최근 30경기, 최대 28일. 이름 대신 id로 조합을 만들고 모순된 중복은 제외한다.
 */
function buildDuoStats(input, { now = Date.now(), limit = 30, minGames = 5 } = {}) {
  input = input && typeof input === 'object' ? input : {};
  const people = new Map();
  for (const p of Array.isArray(input.members) ? input.members : []) if (p && typeof p.id === 'string' && p.id && p.active !== false) {
    people.set(p.id, { id: p.id, name: String(p.name || '클럽원') });
  }
  const seen = new Map(), conflicts = new Set();
  let ignored = 0;
  for (const m of Array.isArray(input.matches) ? input.matches : []) {
    if (!m || typeof m.id !== 'string' || !m.id || !Number.isFinite(m.at) || m.at > now || m.at < now - 28 * 86400000 ||
        !Array.isArray(m.teams) || m.teams.length !== 2) { ignored++; continue; }
    const valid = m.teams.every(t => t && Array.isArray(t.ids) && t.ids.length === 2 &&
      t.ids.every(id => typeof id === 'string' && id) && Number.isInteger(t.score) && t.score >= 0 && t.score <= 99);
    if (!valid || new Set(m.teams.flatMap(t => t.ids)).size !== 4) { ignored++; continue; }
    const teams = m.teams.map(t => ({ ids: t.ids.slice().sort(), score: t.score })).sort((a, b) => JSON.stringify(a.ids).localeCompare(JSON.stringify(b.ids)));
    const normalized = { id: m.id, at: m.at, teams };
    const old = seen.get(m.id);
    if (old && JSON.stringify(old) !== JSON.stringify(normalized)) conflicts.add(m.id);
    else seen.set(m.id, normalized);
  }
  const matches = [...seen.values()].filter(m => !conflicts.has(m.id) && m.teams.some(t => t.ids.some(id => people.has(id))))
    .sort((a, b) => b.at - a.at || a.id.localeCompare(b.id));
  const players = new Map(), pairs = new Map();
  const add = (map, key, ids, game) => {
    if (!map.has(key)) map.set(key, { key, ids, members: ids.map(id => people.get(id)), matches: [] });
    map.get(key).matches.push(game);
  };
  for (const m of matches) m.teams.forEach((team, i) => {
    const other = m.teams[1 - i];
    const result = team.score > other.score ? 'w' : team.score < other.score ? 'l' : 'd';
    const game = { id: m.id, at: m.at, result, gf: team.score, ga: other.score, own: team.ids, opponent: other.ids };
    for (const id of team.ids) if (people.has(id)) add(players, id, [id], game);
    if (team.ids.every(id => people.has(id))) add(pairs, JSON.stringify(team.ids), team.ids, game);
  });
  const finish = (entry) => {
    const games = entry.matches.slice(0, limit);
    const count = result => games.filter(m => m.result === result).length;
    return { ...entry, matches: games, played: games.length, win: count('w'), draw: count('d'), lose: count('l'),
      winRate: games.length ? Math.round(count('w') * 1000 / games.length) / 10 : null, eligible: games.length >= minGames };
  };
  const order = (a, b) => Number(b.eligible) - Number(a.eligible) || b.winRate - a.winRate || b.played - a.played || a.key.localeCompare(b.key);
  const rank = (rows) => {
    rows.sort(order);
    let last = null, rankNo = 0, eligibleIndex = 0;
    return rows.map(row => {
      if (!row.eligible) return { ...row, rank: null };
      eligibleIndex++;
      if (!last || last.winRate !== row.winRate || last.played !== row.played) rankNo = eligibleIndex;
      last = row;
      return { ...row, rank: rankNo };
    });
  };
  return { people, players: rank([...players.values()].map(finish)), pairs: rank([...pairs.values()].map(finish)),
    matches, minGames, limit, ignored: ignored + conflicts.size };
}

  const minPossession = isNum(d.min_possession_games) ? d.min_possession_games : minApps;
  const hasRecords = !!(d.members_counted || d.possession_members_counted);
  const W = winSize(d);
  const lists = AWARD_CATS.map((c) => (aw[c.key] && Array.isArray(aw[c.key].list) ? aw[c.key].list : []));
  const all = lists.flat();
  await waitAtMost(Promise.all([loadNames(all.map((e) => e.spid).filter(Number.isFinite)), loadSeasons()]), 2500);
  if (stale(seq)) return;
  for (const e of all) {
    const mb = e.member || {};
    if (!mb.discord_id) continue;
    if (!state.statsMembers) state.statsMembers = new Map();
    if (!state.statsMembers.has(mb.discord_id)) state.statsMembers.set(mb.discord_id, { discord_id: mb.discord_id, name: mb.name, link: { nickname: mb.nickname } });
  }
  const onRow = () => rememberPlace('어워드');
  /* 디스코드 이름에 게임 닉네임이 이미 들어 있으면 닉네임은 다시 쓰지 않는다 */
  const owner = (mb) => h('span', { class: 'aw-own' }, h('b', null, mb.name || mb.nickname || '클럽원'), statsMeBadge(mb),
    mb.nickname && !String(mb.name || '').includes(mb.nickname) ? h('span', { class: 'nk' }, mb.nickname) : null);
  const link = (mb, cls, kids) => (mb && mb.discord_id
    ? h('a', { class: cls + (isStatsMe(mb) ? ' is-me' : ''), href: `#/stats/m/${mb.discord_id}/${type}`, onclick: onRow }, kids)
    : h('div', { class: cls }, kids));
  const games = (c, e) => `${c.key === 'save' ? e.gk_apps : e.apps}경기`;
  function winner(c, e, tied) {
    const mb = e.member || {};
    if (c.key === 'possession') return link(mb, 'aw-win', [
      h('span', { class: 'aw-club-mark', 'aria-hidden': 'true' }, 'NV'),
      h('div', { class: 'aw-id' }, h('span', { class: 'aw-1' }, tied ? '공동 1위' : '1위'), owner(mb)),
      h('div', { class: 'aw-val' }, h('b', null, c.val(e)), h('small', null, c.sub(e)))]);
    return link(mb, 'aw-win', [
      faceEl(e.spid, 'pf-aw'),
      h('div', { class: 'aw-id' },
        h('span', { class: 'aw-1' }, tied ? '공동 1위' : '1위'),
        h('div', { class: 'pl-name' }, seasonEl(e.spid), nameEl(e.spid)),
        h('div', { class: 'pl-tags' }, posChip(e.pos), gradeChip(e.grade), h('span', { class: 'aw-gm' }, games(c, e))),
        owner(mb)),
      h('div', { class: 'aw-val' }, h('b', null, c.val(e)), h('small', null, c.sub(e)))]);
  }
  function runner(c, e) {
    const mb = e.member || {};
    if (c.key === 'possession') return h('li', null, link(mb, 'aw-row', [
      h('span', { class: 'aw-n' + (e.rank === 1 ? ' aw-n1' : '') }, String(e.rank)),
      h('div', { class: 'aw-id' }, owner(mb)),
      h('div', { class: 'aw-rv' }, h('b', null, c.val(e)), h('small', null, c.sub(e)))]));
    return h('li', null, link(mb, 'aw-row', [
      h('span', { class: 'aw-n' + (e.rank === 1 ? ' aw-n1' : '') }, String(e.rank)),
      faceEl(e.spid, 'pf-sm'),
      h('div', { class: 'aw-id' },
        h('div', { class: 'pl-name' }, seasonEl(e.spid), nameEl(e.spid)),
        owner(mb)),
      h('div', { class: 'aw-rv' }, h('b', null, c.val(e)), h('small', null, c.sub(e)))]));
  }
  const empty = {
    possession: aw.possession ? `점유율 기록이 있고 ${minPossession}경기 이상 뛴 클럽원이 아직 없어요.` : '점유율 집계를 준비하고 있어요.',
    goals: `선발 ${minApps}경기 이상 뛰고 골을 넣은 선수가 아직 없어요.`,
    assists: `선발 ${minApps}경기 이상 뛰고 도움을 한 선수가 아직 없어요.`,
    tackle: d.tackle_data
      ? `선발 ${minApps}경기 이상, 태클 ${rules.min_tackles ?? 30}번 이상 한 수비수가 아직 없어요.`
      : '선수별 태클 수는 새로 모은 경기부터 세요. 기록이 쌓이면 여기에 보여요.',
    save: `골키퍼로 선발 ${minApps}경기 이상, 유효슈팅 ${rules.min_faced ?? 30}개 이상 받은 선수가 아직 없어요.`,
  };
  function section(c, list) {
    const box = h('section', { class: 'aw' + (c.key === 'possession' ? ' aw-possession' : ''), 'aria-labelledby': `aw-${c.key}` },
      h('div', { class: 'aw-h' }, h('h2', { id: `aw-${c.key}` }, c.title), h('span', null, c.what)));
    if (!list.length) { append(box, [h('p', { class: 'aw-empty' }, empty[c.key])]); return box; }
    const rest = list.slice(1);
    const ol = h('ol', { class: 'aw-list' });
    let open = false;
    const more = rest.length > AW_SHOW - 1 ? h('button', { class: 'aw-more', type: 'button', 'aria-expanded': 'false' }) : null;
    const paint = () => {
      ol.replaceChildren(...(open ? rest : rest.slice(0, AW_SHOW - 1)).map((e) => runner(c, e)));
      if (more) { more.textContent = open ? '접기' : `${list.length}위까지 보기`; more.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    };
    if (more) more.addEventListener('click', () => { open = !open; paint(); });
    paint();
    append(box, [winner(c, list[0], rest.length > 0 && rest[0].rank === 1), rest.length ? ol : null, more]);
    return box;
  }
  const any = lists.some((l) => l.length);
  show([head(),
    h('p', { class: 'rk-cov' },
      h('span', null, `최근 ${W}경기 · 선수 기록 ${d.members_counted ?? 0}명 · ` + (aw.possession ? `점유율 기록 ${d.possession_members_counted ?? 0}명` : '점유율 집계 준비 중')),
      h('span', null, d.updated_at ? ['갱신 ', timeEl(d.updated_at, true)] : '아직 모은 기록이 없어요')),
    refillNote(d, `선발 ${minApps}경기 이상`),
    hasRecords ? null : h('div', { class: 'st-empty', style: 'margin-top:18px' }, h('p', null, '아직 모은 기록이 없어요.'), h('p', null, '클럽원 기록을 모으면 여기에 보여요.')),
    hasRecords ? h('div', { class: 'aw-grid' }, AWARD_CATS.map((c, i) => section(c, lists[i]))) : null,
    any || hasRecords ? h('ul', { class: 'aw-rules' },
      h('li', null, `클럽원마다 최근 ${W}경기에서 선발로 ${minApps}경기 이상 뛴 선수만 넣어요. 같은 선수라도 쓴 클럽원이 다르면 따로 세요.`),
      h('li', null, `수비왕은 수비수(DF) 자리에서 태클을 ${rules.min_tackles ?? 30}번 이상 한 선수의 태클 성공률이에요.`),
      h('li', null, `선방왕은 골키퍼로 상대 유효슈팅을 ${rules.min_faced ?? 30}개 이상 받은 선수가 골을 내주지 않은 비율이에요.`),
      h('li', null, `볼돌왕은 ${minPossession}경기 이상 뛴 클럽원의 평균 볼 점유율이에요. 같은 평균이면 공동 순위로 표시해요.`)) : null,
    statsAttr()]);
  restorePlace();
}

/* ---------- 검색(#/stats/search/<닉네임>/<경기 종류>) ---------- */
const recentSearches = []; // 이 탭을 닫으면 사라진다(브라우저에 저장하지 않음)
const SEARCH_ERR = { nickname_required: '닉네임을 적어 주세요.', nickname_bad: '닉네임에 쓸 수 없는 글자가 있거나 너무 길어요.' };
async function renderSearch(nick, type, seq) {
  setTitle(nick ? `${nick} 전적 검색` : '전적 검색');
  const enc = encodeURIComponent(nick);
  const input = h('input', { class: 'input', id: 'sr-q', type: 'search', maxlength: 30, autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', enterkeyhint: 'search', placeholder: 'FC 온라인 닉네임' });
  input.value = nick;
  const ferr = h('p', { class: 'alert form-err', role: 'alert' });
  const form = h('form', { class: 'sr-form', role: 'search', novalidate: true },
    h('label', { class: 'sr-only', for: 'sr-q' }, 'FC 온라인 닉네임'),
    h('div', { class: 'sr-row' }, input, h('button', { class: 'btn btn-primary', type: 'submit' }, '검색')),
    h('p', { class: 'hint' }, '넥슨에 있는 FC 온라인 닉네임이면 누구나 찾을 수 있어요.'),
    ferr);
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const v = input.value.trim();
    if (!v) { ferr.textContent = SEARCH_ERR.nickname_required; input.focus(); return; }
    ferr.textContent = '';
    go(`#/stats/search/${encodeURIComponent(v)}`);
  });
  const recent = () => (recentSearches.length
    ? h('div', { class: 'sr-recent' }, h('span', { class: 'sr-recent-h', id: 'sr-recent-h' }, '최근 검색'),
      h('ul', { class: 'chips', 'aria-labelledby': 'sr-recent-h' }, recentSearches.map((n) => h('li', null, h('a', { class: 'chip', href: `#/stats/search/${encodeURIComponent(n)}` }, n)))))
    : null);
  const head = () => [tabs(STATS_TAB), statsNav('search'), h('p', { class: 'idx' }, 'SEARCH'), h('h1', { class: 'h1', tabindex: '-1' }, '전적 검색'), form];
  if (!nick) return show([head(), recent(), statsAttr()]);
  if (!recentSearches.includes(nick)) { recentSearches.unshift(nick); recentSearches.length = Math.min(recentSearches.length, 8); }
  const key = `s:${nick.toLowerCase()}:${type}`;
  let d = cacheGet(key);
  const waited = !d;
  if (!d) {
    show([head(), recent(), h('div', { class: 'loading', role: 'status' }, '넥슨에서 찾고 있어요. 몇 초 걸릴 수 있어요.'), statsAttr()]);
    try { d = await api(`/api/stats/search?nickname=${enc}&type=${type}`); } catch (e) {
      if (e.handled || stale(seq)) return;
      const again = ['rate', 'nexon_busy', 'nexon_unavailable', 'network', 'server'].includes(e.code) || !(SEARCH_ERR[e.code] || STATS_ERR[e.code]);
      show([head(), recent(),
        h('div', { class: 'alert', role: 'alert' }, h('p', { style: 'margin:0' }, SEARCH_ERR[e.code] || statsErr(e)),
          again ? h('button', { class: 'btn btn-ghost', type: 'button', style: 'margin-top:12px', onclick: () => renderSearch(nick, type, ++state.seq) }, '다시 찾기') : null),
        statsAttr()]);
      return;
    }
    if (stale(seq)) return;
    cacheSet(key, d);
  }
  const toMember = () => rememberPlace('검색');
  const ui = { shown: MATCH_PAGE, open: new Set() };
  const bodyBox = h('div', { class: 'pm-body' });
  const fillBody = (dd) => { bodyBox.replaceChildren(); append(bodyBox, detailBody(dd, type, { oppHref: oppHrefFor(type), onOpp: toMember, ui })); };
  const prep = (dd) => waitAtMost(Promise.all([loadNames(detailSpids(dd)), loadSeasons()]), 2500);
  await prep(d);
  if (stale(seq)) return;
  const pl = d.player || {};
  const cm = d.club_member;
  fillBody(d);
  show([head(), recent(),
    h('section', { class: 'sr-res', 'aria-labelledby': 'sr-res-h' },
      detailHead({
        tag: 'h2', id: 'sr-res-h', title: pl.nickname || nick, level: pl.level, isMe: isStatsMe(cm), hd: d, type, hrefFor: (t) => `#/stats/search/${enc}/${t}`,
        extra: cm && cm.discord_id ? h('p', { class: 'sr-club' }, 'NV 클럽원이에요. ', h('a', { class: 'sr-club-link', href: `#/stats/m/${cm.discord_id}/${type}`, onclick: toMember }, `${cm.name || '클럽원'} 페이지로`)) : null,
      }),
      bodyBox),
    statsAttr()], { keepScroll: waited });
  const hEl = $('sr-res-h');
  if (hEl && state.navigated) hEl.focus({ preventScroll: true });
  restorePlace();
  /* 이어 받으면 결과 본문만 바꾼다. 검색창에 다음 닉네임을 치는 중이어도 끊기지 않는다 */
  await fillPending(`/api/stats/search?nickname=${enc}&type=${type}`, d, seq, async (nd) => {
    cacheSet(key, nd);
    await prep(nd);
    if (stale(seq)) return;
    keepFocusIn(bodyBox, () => fillBody(nd));
  });
}

function roleColor(c) { return c ? '#' + Number(c).toString(16).padStart(6, '0') : '#6f6f6b'; }

/* 역할 고르기: 이름 · 색 점 · 우리 명단의 인원 */
function rolePicker(roles, selected, opts) {
  opts = opts || {};
  const sel = new Set(selected || []);
  const sum = h('p', { class: 'rp-sum' });
  const paintSum = () => {
    const names = roles.filter((r) => sel.has(r.id)).map((r) => r.name);
    sum.textContent = names.length ? `고른 역할: ${names.join(', ')}` : '아직 고른 역할이 없어요.';
  };
  const name = 'rp-' + Math.random().toString(36).slice(2, 8);
  const list = h('div', { class: 'rp-list' + (opts.compact ? ' compact' : ''), role: 'group', 'aria-label': opts.label || '역할' });
  for (const r of roles) {
    const cb = h('input', { type: 'checkbox', name, value: r.id });
    cb.checked = sel.has(r.id);
    cb.addEventListener('change', () => { if (cb.checked) sel.add(r.id); else sel.delete(r.id); paintSum(); });
    list.append(h('label', { class: 'rp-row' }, cb, roleDot(r), h('span', { class: 'rp-name' }, r.name), h('span', { class: 'rp-n' }, `${r.member_count}명`)));
  }
  if (!roles.length) list.append(h('p', { class: 'rp-none' }, '역할 목록이 비어 있어요.'));
  paintSum();
  return { el: h('div', { class: 'rp' }, sum, list), value: () => roles.filter((r) => sel.has(r.id)).map((r) => r.id) };
}

async function renderAdminMembers(seq, keep) {
  setTitle('멤버 관리');

  try { d = await api('/api/members'); } catch (e) {
    if (e.handled || stale(seq)) return;

  }
  if (stale(seq)) return;
  const ui = keep || { q: '', filter: 'all', open: null };
  const strong = (m) => m.suggestions.some((s) => s.strong);
  const FILTERS = [
    { key: 'all', label: '전체', test: () => true },
    { key: 'suggest', label: '추천 있음', test: (m) => strong(m) && !m.excluded && !m.left },

  function paint() {

    const rows = d.members.filter((m) => f.test(m) && matches(m)).sort((a, b) => (a.left - b.left) || a.name.localeCompare(b.name, 'ko'));

  }
  async function reload() {
    d = await api('/api/members');
    paintSummary(); paintChips(); paint();
  }
  async function include(m, btn) {
    btn.disabled = true;
    try {
      await api(`/api/members/${m.id}`, { method: 'PATCH', body: { excluded: false } });

      h('div', { class: 'field' }, h('label', { for: name.id }, '이름'), name),
      h('div', { class: 'field' }, h('label', { for: order.id }, '순서'), order),
      h('div', { class: 'field f-wide' }, h('label', { for: layout.id }, '모양'), layout),
      h('div', { class: 'field f-wide' }, h('label', { for: intro.id }, '소개 문구 (120자까지)'), intro)),
    h('div', { class: 'b-pols' }, pols.map((p) => p.el)),
    h('div', { class: 'b-toggles' },
      toggle(own, '작성자 본인 글은 볼 수 있음', '읽기가 막혀 있어도 쓴 사람은 자기 글과 답을 봐요. 건의사항이 이렇게 돼 있어요.'),
      toggle(rc, '읽음 확인 집계', '‘확인했어요’ 버튼과 읽음 현황을 써요. 공지사항이 이렇게 돼 있어요.'),
      toggle(anon, '익명 글', '쓴 사람 이름 대신 ‘익명’으로 보여요. 운영진과 관리자에게도 이름이 보이지 않고, 쓴 사람만 ‘나’로 보여요. 건의사항이 이렇게 돼 있어요. 읽음 확인 집계와는 같이 못 써요.'),
      toggle(pub, '홈페이지에 제목 공개', '로그인하지 않은 사람도 홈페이지 ‘클럽 소식’에서 최근 글 제목과 날짜를 봐요. 내용과 쓴 사람은 클럽원만 봐요. 읽기가 ‘클럽원 전체’인 게시판만 켤 수 있어요.'),
      hid ? toggle(hid, '숨기기', '탭에서 빠져요. 글은 지우지 않아요.') : null),
    err,
    h('div', { class: 'actions' }, submit));
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const body = { name: name.value.trim(), private_own: own.checked, receipts_enabled: rc.checked, public_titles: pub.checked, anonymous: anon.checked, layout: layout.value, intro: intro.value.trim() };
    if (order.value !== '') body.sort_order = Number(order.value);
    for (const p of pols) Object.assign(body, p.get());
    if (hid) body.hidden = hid.checked;
    if (isNew) body.slug = slug.value.trim();
    if (isNew && !/^[a-z0-9-]{2,20}$/.test(body.slug)) { err.textContent = ADMIN_ERR.bad_slug; slug.focus(); return; }
    if (!body.name) { err.textContent = ADMIN_ERR.name_required; name.focus(); return; }
    submit.disabled = true;
    try {
      if (isNew) await api('/api/admin/boards', { method: 'POST', body });
      else await api(`/api/admin/boards/${d.slug}`, { method: 'PATCH', body });
      await loadBoards();
      toast(isNew ? '게시판을 만들었어요.' : `${body.name} 설정을 저장했어요.`);
      reload();
    } catch (e) { if (e.handled) return; err.textContent = adminErr(e); submit.disabled = false; }
  });
  return form;
}

/* ---------- 권한 설정 ---------- */
async function renderAdminRoles(seq, keep) {
  setTitle('권한 설정');
  if (!keep) show(adminFrame('roles', loadingEl()));
  let st, rl;
  try { [st, rl] = await Promise.all([api('/api/admin/settings'), api('/api/admin/roles')]); } catch (e) {
    if (e.handled || stale(seq)) return;
    return adminFail('roles', '권한 설정', e, () => renderAdminRoles(++state.seq));
  }
  if (stale(seq)) return;
  const staffP = rolePicker(rl.roles, st.staff_role_ids, { label: '운영진 역할' });
  const adminP = rolePicker(rl.roles, st.admin_role_ids, { label: '관리자 역할' });
  const err = h('p', { class: 'alert form-err', role: 'alert' });
  const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, '권한 저장');
  const owners = st.owners.map((o) => o.name || `아이디 ${o.id}`).join(', ');
  const form = h('form', { class: 'form', novalidate: true },
    h('section', { class: 'panel', 'aria-labelledby': 'r-staff' },
      h('h2', { class: 'h2', id: 'r-staff' }, '운영진으로 인정할 디스코드 역할'),
      h('p', { class: 'hint', style: 'margin-bottom:12px' }, '공지 쓰기, 글 숨기기와 지우기, 읽음 현황, 건의사항 읽기를 할 수 있어요.'),
      staffP.el),
    h('section', { class: 'panel', 'aria-labelledby': 'r-admin' },
      h('h2', { class: 'h2', id: 'r-admin' }, '관리 페이지에 들어올 수 있는 디스코드 역할'),
      h('p', { class: 'hint', style: 'margin-bottom:12px' }, '멤버 관리, 게시판 설정, 권한 설정을 할 수 있어요. 관리자는 운영진이 하는 일도 모두 할 수 있어요.'),
      adminP.el),
    err,
    h('div', { class: 'actions' }, submit));
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    err.textContent = '';
    const staff = staffP.value();
    if (!staff.length) { err.textContent = ADMIN_ERR.no_staff_roles; return; }
    submit.disabled = true;
    try {
      const r = await api('/api/admin/settings', { method: 'PUT', body: { staff_role_ids: staff, admin_role_ids: adminP.value() } });
      toast(`저장했어요. ${r.recomputed}명의 권한을 바로 바꿨어요.`);
      state.me = (await api('/api/me')).me;
      renderWho();
      await loadBoards();
      if (!state.me.is_admin) return route();
      renderAdminRoles(++state.seq, true);
    } catch (e) { if (e.handled) return; err.textContent = adminErr(e); submit.disabled = false; }
  });
  show(adminFrame('roles', [
    adminTitle('ROLES', '권한 설정', [
      '디스코드 역할로 운영진과 관리자를 정해요. 저장하면 사이트에 저장된 역할 정보로 바로 다시 계산해요.',
      '역할 옆 숫자는 이 사이트 명단에 있는 사람 수예요.',
    ]),
    h('p', { class: 'owner-note' }, '소유자(사이트를 만든 사람)는 항상 관리자예요.', owners ? ` 지금 소유자: ${owners}` : ''),
    form]), { keepScroll: !!keep });
}

/* ---------- 시작 ---------- */
$('logoutBtn').addEventListener('click', async () => {
  try { await api('/api/session', { method: 'DELETE', noAuthRedirect: true }); } catch (e) {}
  clearToken();
  state.me = null;
  state.loginError = null;
  renderWho();
  history.replaceState(null, '', location.pathname + location.search + '#/');
  route();
  toast('로그아웃했어요.');
});

/* 디스코드 로그인 뒤 돌아온 #ticket=… / #error=… 를 읽고 주소에서 바로 지운다 */
async function consumeAuthFragment() {
  const raw = location.hash.slice(1);
  if (/^(ticket|error)=/.test(raw)) {
    const p = new URLSearchParams(raw);
    history.replaceState(null, '', location.pathname + location.search);
    if (p.get('error')) {
      state.loginError = p.get('error');
    } else {
      show(loadingEl('로그인하는 중이에요.'));
      try {
        const r = await api('/api/session', { method: 'POST', body: { ticket: p.get('ticket') || '' }, noAuthRedirect: true });
        saveToken(r.token);
        state.me = r.me;
        history.replaceState(null, '', location.pathname + location.search + (r.next || '#/'));
      } catch (e) {
        state.loginError = e.code === 'not_member' ? 'not_member' : e.code === 'ticket' ? 'ticket' : 'server';
      }
    }
  }
}

async function boot() {
  await consumeAuthFragment();
  if (!state.token) state.token = loadToken();
  document.body.classList.toggle('tall', !!state.token && /^#\/stats(\/|$)/.test(location.hash));
  if (state.token && !state.me) {
    show(loadingEl());
    try {
      state.me = (await api('/api/me', { noAuthRedirect: true })).me;
    } catch (e) {
      if (e.status === 401) { clearToken(); state.loginError = 'session'; }
      else { renderWho(); return show([h('h1', { class: 'h1', tabindex: '-1', style: 'margin-bottom:16px' }, '클럽 공간'), errorBox(e, () => location.reload())]); }
    }
  }
  if (state.me) {
    try { await loadBoards(); } catch (e) {
      if (!e.handled) { renderWho(); return show([h('h1', { class: 'h1', tabindex: '-1', style: 'margin-bottom:16px' }, '클럽 공간'), errorBox(e, () => location.reload())]); }
    }
  }
  renderWho();
  window.addEventListener('hashchange', async () => {
    state.navigated = true;
    if (/^#(ticket|error)=/.test(location.hash)) { await consumeAuthFragment(); if (state.me) { try { await loadBoards(); } catch (e) {} } renderWho(); }
    route();
  });
  route();
}
boot();
</script>
